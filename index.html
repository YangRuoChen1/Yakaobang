                                      <option value="choice">子题：选择题</option>
                                      <option value="text">子题：简答/分析题</option>
                                    </select>
                                    <button onClick={() => setQCaseSubs(p => p.filter((_, i) => i !== idx))} className="text-rose-600">删除</button>
                                  </div>
                                  <input type="text" value={sub.stem} onChange={(e) => setQCaseSubs(p => p.map((x, i) => i === idx ? { ...x, stem: e.target.value } : x))} placeholder={`第 ${idx + 1} 问题目`} className="w-full border rounded px-2.5 py-1.5" />
                                  {sub.type === "choice" && (
                                    <div className="grid grid-cols-2 gap-1.5">
                                      {["A", "B", "C", "D"].map(ok => (
                                        <input key={ok} type="text" value={sub.options?.[ok] || ""} onChange={(e) => setQCaseSubs(p => p.map((x, i) => i === idx ? { ...x, options: { ...(x.options || {}), [ok]: e.target.value } } : x))} placeholder={`选项 ${ok}`} className="border rounded px-2 py-1" />
                                      ))}
                                    </div>
                                  )}
                                  <input type="text" value={sub.answer} onChange={(e) => setQCaseSubs(p => p.map((x, i) => i === idx ? { ...x, answer: e.target.value } : x))} placeholder="该子题参考答案" className="w-full border rounded px-2.5 py-1.5 font-bold" />
                                </div>
                              ))}
                            </div>
                          )}

                          <textarea rows={2} value={qExp} onChange={(e) => setQExp(e.target.value)} placeholder="总体解析..." className="w-full border rounded-xl p-3" />
                          <input type="text" value={qKeyPoint} onChange={(e) => setQKeyPoint(e.target.value)} placeholder="核心考点 / 一句话口诀..." className="w-full border rounded-xl px-3 py-2" />
                          <button onClick={handleSaveManualQuestion} className="w-full py-2.5 rounded-xl bg-emerald-600 text-white font-bold">保存题目到本地</button>
                        </div>
                      )}

                      {/* TAB 4: BROWSE & BATCH MOVE */}
                      {adminTab === "browse" && (() => {
                        const filtered = questions.filter(q =>
                          (browseChapterFilter === "ALL" || q.chapterId === browseChapterFilter) &&
                          (browseTypeFilter === "ALL" || q.type === browseTypeFilter)
                        );
                        return (
                          <div className="space-y-3">
                            <div className="flex flex-wrap gap-2">
                              <select value={browseChapterFilter} onChange={(e) => setBrowseChapterFilter(e.target.value)} className="border rounded-lg px-2.5 py-1.5 flex-1">
                                <option value="ALL">全部章节</option>
                                {curriculum.chapters.map(c => <option key={c.id} value={c.id}>{getChapterLabel(c.id)}</option>)}
                              </select>
                              <select value={browseTypeFilter} onChange={(e) => setBrowseTypeFilter(e.target.value)} className="border rounded-lg px-2.5 py-1.5">
                                <option value="ALL">全部题型</option>
                                <option value="choice">选择题</option>
                                <option value="blank">填空题</option>
                                <option value="case">案例分析</option>
                              </select>
                            </div>
                            <div className="p-3 rounded-xl bg-indigo-50 border border-indigo-200 flex flex-wrap items-center gap-2">
                              <button onClick={() => setSelectedQIds(selectedQIds.length === filtered.length ? [] : filtered.map(q => q.id))} className="px-2.5 py-1 rounded bg-white border font-bold text-indigo-700">
                                {selectedQIds.length === filtered.length && filtered.length > 0 ? "取消全选" : "全选当前"} ({selectedQIds.length})
                              </button>
                              <select value={moveTargetChId} onChange={(e) => setMoveTargetChId(e.target.value)} className="border rounded px-2 py-1 bg-white max-w-xs">
                                {curriculum.chapters.map(c => <option key={c.id} value={c.id}>{getChapterLabel(c.id)}</option>)}
                              </select>
                              <button onClick={() => {
                                if (!selectedQIds.length || !moveTargetChId) return;
                                const s = new Set(selectedQIds);
                                setQuestions(p => p.map(q => s.has(q.id) ? { ...q, chapterId: moveTargetChId } : q));
                                setSelectedQIds([]);
                                showToast("已批量移动章节", "success");
                              }} className="px-3 py-1 rounded bg-indigo-700 text-white font-bold">移动选中</button>
                              <button onClick={() => {
                                if (!selectedQIds.length) return;
                                const s = new Set(selectedQIds);
                                setQuestions(p => p.filter(q => !s.has(q.id)));
                                setSelectedQIds([]);
                                showToast("已批量删除", "info");
                              }} className="px-3 py-1 rounded bg-rose-600 text-white font-bold">删除选中</button>
                            </div>
                            <div className="space-y-2 max-h-72 overflow-y-auto">
                              {filtered.map(q => (
                                <div key={q.id} className="p-3 rounded-xl border flex items-center justify-between gap-2">
                                  <div className="flex items-start gap-2 min-w-0">
                                    <input type="checkbox" checked={selectedQIds.includes(q.id)} onChange={() => setSelectedQIds(p => p.includes(q.id) ? p.filter(x => x !== q.id) : [...p, q.id])} className="mt-1" />
                                    <div className="min-w-0">
                                      <div className="font-bold text-blue-700">[{q.type}] {getChapterLabel(q.chapterId)}</div>
                                      <p className="text-slate-700 line-clamp-1">{q.stem}</p>
                                    </div>
                                  </div>
                                  <button onClick={() => setQuestions(p => p.filter(x => x.id !== q.id))} className="text-slate-400 hover:text-rose-600"><Icon name="trash" className="w-4 h-4" /></button>
                                </div>
                              ))}
                            </div>
                          </div>
                        );
                      })()}

                      {/* TAB 5: INVITE CODE MANAGER */}
                      {adminTab === "invites" && (
                        <div className="space-y-4">
                          <div className="p-4 rounded-xl bg-emerald-50 border border-emerald-200 flex flex-wrap items-center justify-between gap-3">
                            <div className="space-y-1">
                              <div className="font-bold text-emerald-900 text-sm">批量生成新邀请码（随时可追加，立即云端生效）</div>
                              <div className="text-[11px] text-emerald-700">一码一用，同学注册核销后自动标记为“已使用”并记录注册邮箱</div>
                            </div>
                            <div className="flex flex-wrap items-center gap-2">
                              <input type="number" min={1} max={100} value={inviteGenCount} onChange={(e) => setInviteGenCount(e.target.value)} className="w-20 border rounded-lg px-2.5 py-1.5 bg-white font-bold text-center" />
                              <input type="text" value={inviteGenNote} onChange={(e) => setInviteGenNote(e.target.value)} placeholder="备注(如: 临床2班)" className="w-36 border rounded-lg px-2.5 py-1.5 bg-white" />
                              <button disabled={inviteBusy} onClick={handleGenerateInvites} className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold shadow">
                                {inviteBusy ? "生成中..." : "+ 生成邀请码"}
                              </button>
                            </div>
                          </div>

                          <div className="flex flex-wrap items-center justify-between gap-2">
                            <div className="font-bold text-slate-700">
                              全部邀请码：{inviteList.length} 个 · 未使用 <span className="text-emerald-600">{inviteList.filter(c => c.status === "unused").length}</span> 个 · 已使用 <span className="text-slate-500">{inviteList.filter(c => c.status === "used").length}</span> 个
                            </div>
                            <button onClick={() => {
                              const unused = inviteList.filter(c => c.status === "unused").map(c => c.code).join("\n");
                              if (!unused) { showToast("暂无未使用的邀请码", "info"); return; }
                              copyTextSafe(unused);
                              showToast("已复制全部未使用邀请码！", "success");
                            }} className="px-3 py-1.5 rounded-lg bg-blue-700 text-white font-bold flex items-center gap-1">
                              <Icon name="copy" className="w-3.5 h-3.5" /> 一键复制全部可用码
                            </button>
                          </div>

                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-72 overflow-y-auto">
                            {inviteList.length === 0 ? (
                              <div className="col-span-2 text-center py-8 text-slate-400">云端暂无邀请码，点击上方“+ 生成邀请码”即可创建第一批！</div>
                            ) : inviteList.map(inv => (
                              <div key={inv.code} className={`p-3 rounded-xl border flex items-center justify-between gap-2 ${inv.status === "used" ? "bg-slate-50 border-slate-200 opacity-75" : "bg-white border-emerald-200"}`}>
                                <div className="min-w-0">
                                  <div className="font-mono font-extrabold text-sm text-slate-900">{inv.code}</div>
                                  <div className="text-[11px] text-slate-500 truncate">
                                    {inv.status === "used" ? `已由 ${inv.usedBy} 使用 (${inv.usedAt})` : `未使用 · ${inv.note || "常规"} · ${inv.createdAt}`}
                                  </div>
                                </div>
                                <div className="flex items-center gap-1.5 shrink-0">
                                  {inv.status === "unused" && (
                                    <button onClick={() => { copyTextSafe(inv.code); showToast(`已复制 ${inv.code}`, "success"); }} className="px-2 py-1 rounded bg-emerald-100 text-emerald-800 font-bold">复制</button>
                                  )}
                                  <button onClick={async () => {
                                    const next = inviteList.filter(x => x.code !== inv.code);
                                    await saveInvitesToCloud(next).catch(() => {});
                                    showToast("已移除该邀请码", "info");
                                  }} className="text-slate-400 hover:text-rose-600"><Icon name="trash" className="w-4 h-4" /></button>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {/* MODAL: FSRS MISTAKES */}
              {showMistakeModal && (
                <div className="fixed inset-0 z-50 bg-slate-950/75 flex items-center justify-center p-4">
                  <div className="w-full max-w-3xl bg-white rounded-2xl shadow-2xl p-5 max-h-[88vh] flex flex-col space-y-4">
                    <div className="flex justify-between items-center border-b pb-3">
                      <h3 className="font-bold text-lg">FSRS 错题强化 ({dueMistakes.length} 到期)</h3>
                      <button onClick={() => setShowMistakeModal(false)}><Icon name="x" className="w-5 h-5" /></button>
                    </div>
                    <div className="overflow-y-auto flex-1 space-y-4">
                      {!dueMistakes[0] ? (
                        <div className="text-center py-12 text-slate-500">🎉 今日到期错题已全部复习完毕！</div>
                      ) : (() => {
                        const mq = dueMistakes[0].question;
                        return (
                          <div className="space-y-4">
                            <div className="text-xs font-bold text-blue-700">{getChapterLabel(mq.chapterId)}</div>
                            <p className="text-sm leading-relaxed whitespace-pre-line">{mq.stem}</p>
                            {mq.type === "choice" && mq.options && (
                              <div className="space-y-1.5">
                                {Object.entries(mq.options).map(([k, v]) => (
                                  <div key={k} className={`px-3 py-2 rounded-lg border text-xs ${mistakeRevealed && String(mq.answer).includes(k) ? "bg-emerald-50 border-emerald-500 font-bold" : "bg-white"}`}>{k}. {v}</div>
                                ))}
                              </div>
                            )}
                            {mistakeRevealed && (
                              <div className="p-4 rounded-xl bg-slate-50 border text-xs space-y-1">
                                <div className="font-bold text-emerald-700">
                                  参考答案：{mq.type === "choice" ? mq.answer : mq.type === "blank" ? (mq.blanks || []).join(" / ") : "见各子题解析"}
                                </div>
                                <p className="whitespace-pre-line text-slate-700">{mq.explanation}</p>
                              </div>
                            )}
                            {!mistakeRevealed ? (
                              <button onClick={() => setMistakeRevealed(true)} className="w-full py-2.5 rounded-xl bg-blue-700 text-white font-bold text-sm">显示答案与解析</button>
                            ) : (
                              <div className="grid grid-cols-4 gap-2">
                                {[[1, "Again", "bg-rose-600"], [2, "Hard", "bg-amber-600"], [3, "Good", "bg-emerald-600"], [4, "Easy", "bg-sky-600"]].map(([g, l, c]) => (
                                  <button key={g} onClick={() => {
                                    const next = fsrsSchedule(dueMistakes[0].fsrs, g, 0.90);
                                    setMistakes(p => p.map(m => m.id === mq.id ? { ...m, fsrs: next } : m));
                                    setMistakeRevealed(false);
                                  }} className={`${c} text-white rounded-xl py-2 text-xs font-bold`}>{l} ({formatFsrsInterval(fsrsSchedule(dueMistakes[0].fsrs, g, 0.90))})</button>
                                ))}
                              </div>
                            )}
                          </div>
                        );
                      })()}
                    </div>
                  </div>
                </div>
              )}

              {/* MODAL: NOTES */}
              {showNotesModal && session && (() => {
                const curId = session.qIds[session.currentIndex];
                return (
                  <div className="fixed inset-0 z-50 bg-slate-950/60 flex items-center justify-center p-4">
                    <div className="w-full max-w-lg bg-white text-slate-900 rounded-2xl p-5 space-y-3">
                      <div className="flex justify-between font-bold text-sm"><span>个人题目笔记</span><button onClick={() => setShowNotesModal(false)}><Icon name="x" className="w-4 h-4" /></button></div>
                      <textarea rows={6} value={notesMap[curId] || ""} onChange={(e) => setNotesMap(p => ({ ...p, [curId]: e.target.value }))} placeholder="记录本题易错点或老师口头补充..." className="w-full border rounded-xl p-3 text-sm" />
                      <button onClick={() => setShowNotesModal(false)} className="px-4 py-2 rounded-lg bg-blue-700 text-white text-xs font-bold">保存笔记</button>
                    </div>
                  </div>
                );
              })()}

              {/* MODAL: AUTH & CLOUD SYNC */}
              {showAuthModal && (
                <div className="fixed inset-0 z-50 bg-slate-950/70 flex items-center justify-center p-4">
                  <div className="w-full max-w-md bg-white rounded-2xl p-5 space-y-4 text-xs">
                    <div className="flex justify-between font-bold text-base"><span>账号与云端进度同步</span><button onClick={() => setShowAuthModal(false)}><Icon name="x" className="w-5 h-5" /></button></div>
                    <div className="p-3 bg-slate-50 rounded-xl border flex justify-between items-center">
                      <span>当前账号: <strong>{currentUser}</strong> {isAdmin && <span className="ml-1 px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold">管理员</span>}</span>
                      <button onClick={() => { manualLogoutRef.current = true; switchToUser("guest"); setShowAuthModal(false); }} className="text-rose-600 font-bold">退出登录</button>
                    </div>
                    <div className="flex gap-2">
                      <button disabled={cloudBusy} onClick={() => syncUserPersonalSave("push")} className="flex-1 py-2.5 rounded-xl bg-blue-700 text-white font-bold">上传个人做题/打卡进度</button>
                      <button disabled={cloudBusy} onClick={() => syncUserPersonalSave("pull")} className="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white font-bold">拉取个人进度</button>
                    </div>
                  </div>
                </div>
              )}

              {zoomImage && <div onClick={() => setZoomImage(null)} className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4"><img src={zoomImage} alt="" className="max-w-full max-h-[90vh] rounded-lg" /></div>}
            </>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
