    // 2. INDEXEDDB STORAGE ENGINE (BYPASSES 5MB LOCALSTORAGE LIMIT!)

    const IDB_NAME = "yakaobang_idb_v1";
    const IDB_STORE = "kv_store";

      try {
        if (!window.indexedDB) return Promise.resolve(null);
        return new Promise((resolve) => {
          const req = indexedDB.open(IDB_NAME, 1);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        });
      } catch {
        return Promise.resolve(null);
      }
    })();

    async function idbGet(key, fallback = null) {
      try {
        const db = await idbPromise;
        if (db) {
          const val = await new Promise((res) => {
            const tx = db.transaction(IDB_STORE, "readonly");
            const r = tx.objectStore(IDB_STORE).get(key);
            r.onsuccess = () => res(r.result);
            r.onerror = () => res(undefined);
          });
          if (val !== undefined) return val;
        }
      } catch {}
      // Auto-migrate from legacy localStorage if present
      try {
        const raw = localStorage.getItem(key);
        if (raw) {
          const parsed = JSON.parse(raw);
          idbSet(key, parsed);
          return parsed;
        }
      } catch {}
      return fallback;
    }

    async function idbSet(key, value) {
      try {
        const db = await idbPromise;
        if (db) {
          await new Promise((res) => {
            const tx = db.transaction(IDB_STORE, "readwrite");
            tx.objectStore(IDB_STORE).put(value, key);
            tx.oncomplete = () => res();
            tx.onerror = () => res();
          });
          return;
        }
      } catch {}
      try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    }

      let maxStreak = 0, curStreak = 0, prevDate = null;
      checkedKeys.forEach(k => {
        const dt = new Date(k + "T00:00:00");
        if (prevDate && Math.round((dt - prevDate) / 86400000) === 1) curStreak += 1;

        if (curStreak > maxStreak) maxStreak = curStreak;
        prevDate = dt;

      return { totalDays: checkedKeys.length, maxStreak, checkedSet: new Set(checkedKeys) };

    function chunkByByteSize(items, maxBytes = 200 * 1024) {
      const enc = new TextEncoder();

      let cur = [], curBytes = 2;

        if (cur.length > 0 && curBytes + b > maxBytes) {
          chunks.push({ items: cur, bytes: curBytes });
          cur = [item];
          curBytes = b + 2;
        } else {
          cur.push(item);
          curBytes += b;
        }
      }
      if (cur.length > 0) chunks.push({ items: cur, bytes: curBytes });
      return chunks;
    }

    function compressImageFile(file, maxDim = 1200, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w >= h) { h = Math.round((h * maxDim) / w); w = maxDim; }
              else { w = Math.round((w * maxDim) / h); h = maxDim; }
            }
            const canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    const MarkdownLatex = ({ text }) => {
      const ref = useRef(null);
      const html = useMemo(() => {
        if (!text) return "";
        try {

        } catch {}
        return text.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br/>");
      }, [text]);

      useEffect(() => {
        if (!ref.current || !window.renderMathInElement) return;
        try {
          window.renderMathInElement(ref.current, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false },
              { left: "\\(", right: "\\)", display: false },
              { left: "\\[", right: "\\]", display: true }
            ],
            throwOnError: false
          });
        } catch {}
      }, [html]);

      return <div ref={ref} className="md-body text-xs sm:text-sm text-slate-800" dangerouslySetInnerHTML={{ __html: html }} />;
    };

    // FSRS Engine
    const FSRS_DEFAULTS = { w: [0.4, 0.6, 2.4, 5.8, 4.93, 0.94, 0.86, 0.01, 1.49, 0.14, 0.94, 2.18, 0.05, 0.34, 1.26, 0.29, 2.61], DECAY: -0.5, FACTOR: 19 / 81 };
    function createInitialFSRS(nowMs = Date.now()) {
      return { state: "New", stability: 0.4, difficulty: 5.0, elapsedDays: 0, scheduledDays: 0, reps: 0, lapses: 0, lastReview: nowMs, due: nowMs };
    }
    function fsrsSchedule(cardFsrs, grade, nowMs = Date.now()) {
      const w = FSRS_DEFAULTS.w, f = cardFsrs || createInitialFSRS(nowMs);
      const elapsedDays = f.lastReview ? Math.max(0, (nowMs - f.lastReview) / 86400000) : 0;
      const clampD = (d) => Math.min(10, Math.max(1, d));
      const nextIvl = (s) => Math.max(1, Math.round((s / FSRS_DEFAULTS.FACTOR) * (Math.pow(0.90, 1 / FSRS_DEFAULTS.DECAY) - 1)));
      let nextS = f.stability, nextD = f.difficulty, nextState = f.state, nextLapses = f.lapses || 0, nextDays = 1, dueMs = nowMs;
      if (f.reps === 0 || f.state === "New") {
        nextD = clampD(w[4] - Math.exp(w[5] * (grade - 1)) + 1);
        nextS = Math.max(0.1, w[grade - 1]);
        if (grade === 1) { nextState = "Learning"; nextDays = 0; dueMs = nowMs + 600000; }
        else if (grade === 2) { nextState = "Learning"; nextDays = 0.5; dueMs = nowMs + 43200000; }
        else { nextState = "Review"; nextDays = nextIvl(nextS); dueMs = nowMs + nextDays * 86400000; }
      } else {
        const R = f.stability > 0 ? Math.pow(1 + FSRS_DEFAULTS.FACTOR * (elapsedDays / f.stability), FSRS_DEFAULTS.DECAY) : 0;
        nextD = clampD(w[7] * w[4] + (1 - w[7]) * clampD(f.difficulty - w[6] * (grade - 3)));
        if (grade === 1) {
          nextLapses += 1; nextState = "Relearning";
          nextS = Math.max(0.2, w[11] * Math.pow(nextD, -w[12]) * (Math.pow(f.stability + 1, w[13]) - 1) * Math.exp(w[14] * (1 - R)));
          nextDays = 0; dueMs = nowMs + 600000;
        } else {
          nextS = f.stability * (1 + Math.exp(w[8]) * (11 - nextD) * Math.pow(f.stability, -w[9]) * (Math.exp(w[10] * (1 - R)) - 1) * (grade === 2 ? w[15] : 1) * (grade === 4 ? w[16] : 1));
          nextState = "Review"; nextDays = nextIvl(nextS); dueMs = nowMs + nextDays * 86400000;
        }
      }
      return { state: nextState, stability: Number(nextS.toFixed(2)), difficulty: Number(nextD.toFixed(2)), elapsedDays: Number(elapsedDays.toFixed(2)), scheduledDays: nextDays, reps: (f.reps || 0) + 1, lapses: nextLapses, lastReview: nowMs, due: dueMs };
    }
    function formatFsrsInterval(nextFsrs, nowMs = Date.now()) {
      const diffMin = Math.round((nextFsrs.due - nowMs) / 60000);
      if (diffMin < 60) return `${Math.max(1, diffMin)} 分钟`;
      const diffHours = Math.round(diffMin / 60);
      if (diffHours < 24) return `${diffHours} 小时`;
      return `${Math.round(diffHours / 24)} 天`;
    }

    function generateInviteCodeString() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const seg = (n) => Array.from({ length: n }, () => chars[Math.floor(Math.random() * chars.length)]).join("");
      return `YKB-${seg(4)}-${seg(4)}`;
    }
    function checkBlankMatch(userVal, expectedStr) {
      const u = String(userVal || "").trim().toLowerCase().replace(/\s+/g, "");
      if (!u) return false;
      const alts = String(expectedStr || "").split(/[\/｜|]/).map(s => s.trim().toLowerCase().replace(/\s+/g, "")).filter(Boolean);
      return alts.includes(u);
    }
    function renderHighlightedText(text, highlights = []) {
      if (!text) return null;
      if (!highlights || highlights.length === 0) return text;
      const escaped = highlights.filter(Boolean).map(h => h.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
      if (escaped.length === 0) return text;
      const parts = text.split(new RegExp(`(${escaped.join("|")})`, "g"));
      return parts.map((part, idx) => highlights.includes(part) ? <mark key={idx} className="ykb-hl">{part}</mark> : <React.Fragment key={idx}>{part}</React.Fragment>);
    }
    function copyTextSafe(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).catch(() => {}); return; }
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch {}
      document.body.removeChild(ta);
    }

    // Normalize legacy string notes to { text, images, updatedAt }
    function normalizeNote(val) {
      if (!val) return { text: "", images: [], updatedAt: 0 };
      if (typeof val === "string") return { text: val, images: [], updatedAt: Date.now() };
      return { text: val.text || "", images: Array.isArray(val.images) ? val.images : [], updatedAt: val.updatedAt || 0 };

    function normalizeSlide(x, idx = 0) {
      let features = x.features || "";
      if (!features && (x.diagnosticBasis || Array.isArray(x.morphologyFeatures))) {
        const parts = [];
        if (x.diagnosticBasis) parts.push("【核心诊断依据】" + x.diagnosticBasis);
        if (Array.isArray(x.morphologyFeatures) && x.morphologyFeatures.length > 0) {
          parts.push(x.morphologyFeatures.map(m => "• " + m).join("\n"));
        }
        features = parts.join("\n\n");
      }
      let confusing = x.confusing || "";
      if (!confusing && Array.isArray(x.differentialDiagnosis)) {
        confusing = x.differentialDiagnosis.map(d => `• 【vs ${d.confusedWith}】${d.keyDifference}`).join("\n");
      }
      const tips = x.tips || x.examTips || "";
      const anns = (Array.isArray(x.annotations) ? x.annotations : []).map((a, aIdx) => ({
        id: a.id || String.fromCharCode(99 + aIdx),
        label: a.label || `结构 ${aIdx + 1}`,
        desc: a.desc || "",
        x: Number(a.rect?.x ?? a.x ?? 0),
        y: Number(a.rect?.y ?? a.y ?? 0),
        w: Number(a.rect?.width ?? a.w ?? 20),
        h: Number(a.rect?.height ?? a.h ?? 20)
      }));
      return {
        id: x.id || `sl_${Date.now()}_${idx}`,
        name: x.name || `未命名切片 ${idx + 1}`,
        category: x.category || "镜检切片",
        image: x.image || "",
        features,

        tips,
        annotations: anns
      };
    }

      const todayStats = dailyLogs[todayKey] || { studySec: 0, qCount: 0, qCorrect: 0, tasks: {} };
      const todayAccuracy = todayStats.qCount > 0 ? Math.round((todayStats.qCorrect / todayStats.qCount) * 100) : null;
      const checkInStats = useMemo(() => computeCheckInStats(dailyLogs), [dailyLogs]);

      const getAuthHeaders = (isWrite = false, tokenOverride = null) => {
        const tok = tokenOverride !== null ? tokenOverride : (userToken || cloudCfg.anonKey);
        const h = { "apikey": cloudCfg.anonKey, "Authorization": "Bearer " + tok };
        if (isWrite) { h["Content-Type"] = "application/json"; h["Prefer"] = "resolution=merge-duplicates"; }
        return h;
      };

      const refreshSessionToken = async () => {
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        if (refreshToken) {
          try {
            const r = await fetch(`${baseUrl}/auth/v1/token?grant_type=refresh_token`, {
              method: "POST",
              headers: { "apikey": cloudCfg.anonKey, "Content-Type": "application/json" },
              body: JSON.stringify({ refresh_token: refreshToken })
            });
            const d = await r.json();
            if (r.ok && d.access_token) {
              setUserToken(d.access_token);
              if (d.refresh_token) setRefreshToken(d.refresh_token);
              return d.access_token;
            }
          } catch {}
        }
        return "";
      };

      const restFetch = async (url, options = {}, isWrite = false) => {
        const res = await fetch(url, { ...options, headers: { ...getAuthHeaders(isWrite), ...(options.headers || {}) } });
        if (res.status === 401) {
          const fresh = await refreshSessionToken();
          if (fresh) {
            return await fetch(url, { ...options, headers: { ...getAuthHeaders(isWrite, fresh), ...(options.headers || {}) } });
          }
        }
        return res;
      };

      // =========================================================================
      // 6. INCREMENTAL & CHUNKED CLOUD SYNC (GLOBAL BANK + USER PROGRESS)
      // =========================================================================
      const pullGlobalIncremental = useCallback(async (forceAll = false, silent = false) => {
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        try {
          const mRes = await fetch(`${baseUrl}/rest/v1/${TABLE_NAME}?username=eq.${encodeURIComponent(GLOBAL_META_KEY)}&select=data`, { headers: getAuthHeaders(false) });
          if (!mRes.ok) return;
          const mRows = await mRes.json();
          const meta = mRows?.[0]?.data;
          if (!meta || !meta.curriculum) {
            if (!silent) showToast("云端暂无已发布的全局题库", "info");
            return;
          }
          const localVer = safeGetLS("ykb_local_global_version", 0);
          const localQs = await idbGet("ykb_global_questions_v1", []);
          if (!forceAll && meta.version === localVer && Array.isArray(localQs) && localQs.length === meta.totalQuestions) {
            if (!silent) showToast(`题库已是最新版本 (${meta.totalQuestions} 题)，无需重复下载`, "info");
            return;
          }

          const totalChunks = meta.chunkCount || 0;
          const totalBytes = Math.max(1, meta.totalBytes || totalChunks * 100000);
          let loadedQs = [];
          let doneBytes = 0;

          for (let i = 0; i < totalChunks; i++) {
            setSyncProgress({ label: `同步公共题库分片 ${i + 1}/${totalChunks}`, done: i, total: totalChunks, kbDone: Math.round(doneBytes / 1024), kbTotal: Math.round(totalBytes / 1024) });
            const cRes = await fetch(`${baseUrl}/rest/v1/${TABLE_NAME}?username=eq.${encodeURIComponent(GLOBAL_CHUNK_PREFIX + i)}&select=data`, { headers: getAuthHeaders(false) });
            if (cRes.ok) {
              const cRows = await cRes.json();
              const items = cRows?.[0]?.data?.items || [];
              loadedQs = loadedQs.concat(items);
              doneBytes += (cRows?.[0]?.data?.bytes || 0);
            }
          }
          setCurriculum(meta.curriculum);
          setQuestions(loadedQs);
          safeSetLS("ykb_local_global_version", meta.version);
          setSyncProgress(null);
          showToast(`已同步最新题库：${meta.curriculum.subjects.length} 学科 · ${loadedQs.length} 题`, "success");
        } catch {
          setSyncProgress(null);
          if (!silent) showToast("检查题库更新失败", "error");
        }
      }, [userToken]);

      const publishGlobalChunked = async () => {
        if (!isAdmin) return;
        setCloudBusy(true);
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        try {
          const nextCur = { ...curriculum, version: Date.now() };
          setCurriculum(nextCur);
          const chunks = chunkByByteSize(questions, 200 * 1024);
          const totalBytes = chunks.reduce((a, c) => a + c.bytes, 0);
          let doneBytes = 0;

          for (let i = 0; i < chunks.length; i++) {
            setSyncProgress({ label: `发布分片 ${i + 1}/${chunks.length}`, done: i, total: chunks.length, kbDone: Math.round(doneBytes / 1024), kbTotal: Math.round(totalBytes / 1024) });
            const r = await restFetch(`${baseUrl}/rest/v1/${TABLE_NAME}`, {
              method: "POST",
              body: JSON.stringify({ username: GLOBAL_CHUNK_PREFIX + i, data: { items: chunks[i].items, bytes: chunks[i].bytes } })
            });
            if (!r.ok) throw new Error("分片上传 HTTP " + r.status);
            doneBytes += chunks[i].bytes;
          }

          const meta = { version: nextCur.version, totalQuestions: questions.length, chunkCount: chunks.length, totalBytes, curriculum: nextCur, updatedAt: new Date().toISOString(), updatedBy: currentUser };
          const mr = await restFetch(`${baseUrl}/rest/v1/${TABLE_NAME}`, {
            method: "POST",
            body: JSON.stringify({ username: GLOBAL_META_KEY, data: meta })
          });
          if (!mr.ok) throw new Error("Meta HTTP " + mr.status);
          safeSetLS("ykb_local_global_version", nextCur.version);
          setSyncProgress(null);
          showToast(`发布成功！共 ${chunks.length} 个分片 (${Math.round(totalBytes / 1024)} KB)，全端将自动增量拉取`, "success");
        } catch (e) {
          setSyncProgress(null);
          showToast("发布失败：" + e.message, "error");
        } finally {
          setCloudBusy(false);
        }
      };

      // Slides Incremental Pull / Publish / Cloud Clear
      const pullSlidesIncremental = useCallback(async (silent = true) => {
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        try {
          const mRes = await fetch(`${baseUrl}/rest/v1/${TABLE_NAME}?username=eq.${encodeURIComponent(SLIDES_META_KEY)}&select=data`, { headers: getAuthHeaders(false) });
          if (!mRes.ok) return;
          const mRows = await mRes.json();
          const meta = mRows?.[0]?.data;
          if (!meta) return;
          const localVer = safeGetLS("ykb_local_slides_version", 0);
          if (meta.cleared) {
            if (localVer !== meta.version) {
              setSlides([]);
              setSlidesEnabled(false);
              safeSetLS("ykb_local_slides_version", meta.version);
              if (!silent) showToast("管理员已关闭并清空临时切片库", "info");
            }
            return;
          }
          if (meta.version === localVer) return;
          const totalChunks = meta.chunkCount || 0;
          let loaded = [];
          for (let i = 0; i < totalChunks; i++) {
            setSyncProgress({ label: `同步镜检切片分片 ${i + 1}/${totalChunks}`, done: i, total: totalChunks, kbDone: i * 150, kbTotal: Math.max(1, Math.round((meta.totalBytes || 1000) / 1024)) });
            const cRes = await fetch(`${baseUrl}/rest/v1/${TABLE_NAME}?username=eq.${encodeURIComponent(SLIDES_CHUNK_PREFIX + i)}&select=data`, { headers: getAuthHeaders(false) });
            if (cRes.ok) {
              const cRows = await cRes.json();
              loaded = loaded.concat(cRows?.[0]?.data?.items || []);
            }
          }
          setSlides(loaded);
          setSlidesEnabled(true);
          safeSetLS("ykb_local_slides_version", meta.version);
          setSyncProgress(null);
          if (!silent) showToast(`已同步最新镜检切片库 (${loaded.length} 张)`, "success");
        } catch {
          setSyncProgress(null);
        }
      }, [userToken]);

      const publishSlidesChunked = async () => {
        if (!isAdmin) return;
        setCloudBusy(true);
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        try {
          const ver = Date.now();
          const chunks = chunkByByteSize(slides, 200 * 1024);
          const totalBytes = chunks.reduce((a, c) => a + c.bytes, 0);
          let doneBytes = 0;
          for (let i = 0; i < chunks.length; i++) {
            setSyncProgress({ label: `发布切片分片 ${i + 1}/${chunks.length}`, done: i, total: chunks.length, kbDone: Math.round(doneBytes / 1024), kbTotal: Math.round(totalBytes / 1024) });
            const r = await restFetch(`${baseUrl}/rest/v1/${TABLE_NAME}`, {
              method: "POST",
              body: JSON.stringify({ username: SLIDES_CHUNK_PREFIX + i, data: { items: chunks[i].items, bytes: chunks[i].bytes } })
            });
            if (!r.ok) throw new Error(r.status === 401 ? "401 登录凭证已过期，请点右上角退出后重新登录一次" : ("HTTP " + r.status));
            doneBytes += chunks[i].bytes;
          }
          const meta = { version: ver, cleared: false, totalSlides: slides.length, chunkCount: chunks.length, totalBytes, updatedAt: new Date().toISOString() };
          const smr = await restFetch(`${baseUrl}/rest/v1/${TABLE_NAME}`, { method: "POST", body: JSON.stringify({ username: SLIDES_META_KEY, data: meta }) }); if (!smr.ok) throw new Error("HTTP " + smr.status);
          safeSetLS("ykb_local_slides_version", ver);
          setSlidesEnabled(true);
          setSyncProgress(null);
          showToast(`已发布 ${slides.length} 张切片至全端！`, "success");
        } catch (e) { setSyncProgress(null); showToast("切片发布失败：" + e.message, "error"); }
        finally { setCloudBusy(false); }
      };

      const clearCloudSlides = async () => {
        if (!isAdmin) return;
        setCloudBusy(true);
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        try {
          const ver = Date.now();
          const cr = await restFetch(`${baseUrl}/rest/v1/${TABLE_NAME}`, {
            method: "POST",
            body: JSON.stringify({ username: SLIDES_META_KEY, data: { version: ver, cleared: true, totalSlides: 0, chunkCount: 0 } })
          });
          setSlides([]);
          setSlidesEnabled(false);
          safeSetLS("ykb_local_slides_version", ver);
          showToast("已清空云端临时切片库，所有同学端将同步移除！", "success");
        } catch (e) { showToast("清空失败：" + e.message, "error"); }
        finally { setCloudBusy(false); }
      };

      // User Progress Incremental Pull & Push (Only uploads/downloads changed parts!)
      const syncUserProgress = useCallback(async (mode = "auto_pull", silent = false, useKeepalive = false) => {
        if (!currentUser || currentUser === "guest") return;
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        const uMetaKey = `ykb_u_${currentUser}_meta`;
        const uProgKey = `ykb_u_${currentUser}_prog`;
        const uNotesKey = `ykb_u_${currentUser}_notes`;

        try {
          if (mode === "pull" || mode === "auto_pull") {
            const mRes = await fetch(`${baseUrl}/rest/v1/${TABLE_NAME}?username=eq.${encodeURIComponent(uMetaKey)}&select=data`, { headers: getAuthHeaders(false) });
            if (!mRes.ok) return;
            const mRows = await mRes.json();
            const rMeta = mRows?.[0]?.data;
            if (!rMeta) {
              if (!silent) showToast("云端暂无个人进度存档", "info");
              return;
            }
            const localSyncAt = safeGetLS(getUserKey(currentUser, "lastSyncAt"), 0);
            if (mode === "auto_pull" && (rMeta.updatedAt || 0) <= localSyncAt) {
              return; // Nothing changed on cloud! Skip download
            }

            // Pull prog if newer
            if (mode === "pull" || (rMeta.progUpdatedAt || 0) > localSyncAt) {
              const pRes = await fetch(`${baseUrl}/rest/v1/${TABLE_NAME}?username=eq.${encodeURIComponent(uProgKey)}&select=data`, { headers: getAuthHeaders(false) });
              if (pRes.ok) {
                const pRows = await pRes.json();
                const pd = pRows?.[0]?.data;
                if (pd) {
                  if (pd.attemptedMap) setAttemptedMap(prev => ({ ...pd.attemptedMap, ...prev }));
                  if (Array.isArray(pd.mistakes)) setMistakes(prev => prev.length >= pd.mistakes.length ? prev : pd.mistakes);
                  if (Array.isArray(pd.markedIds)) setMarkedIds(prev => Array.from(new Set([...prev, ...pd.markedIds])));
                  if (pd.highlightsMap) setHighlightsMap(prev => ({ ...pd.highlightsMap, ...prev }));
                  if (pd.dailyLogs) setDailyLogs(prev => {
                    const merged = { ...pd.dailyLogs };
                    Object.entries(prev).forEach(([k, v]) => {
                      const rv = merged[k];
                      merged[k] = !rv || (v.qCount || 0) >= (rv.qCount || 0) ? v : rv;
                    });
                    return merged;
                  });
                  if (pd.lastPosMap) setLastPosMap(prev => ({ ...pd.lastPosMap, ...prev }));
                }
              }
            }

            // Pull notes ONLY if notesUpdatedAt changed
            if (mode === "pull" || (rMeta.notesUpdatedAt || 0) > localSyncAt) {
              const nRes = await fetch(`${baseUrl}/rest/v1/${TABLE_NAME}?username=eq.${encodeURIComponent(uNotesKey)}&select=data`, { headers: getAuthHeaders(false) });
              if (nRes.ok) {
                const nRows = await nRes.json();
                const nd = nRows?.[0]?.data?.notesMap;
                if (nd) {
                  setNotesMap(prev => {
                    const merged = { ...prev };
                    Object.entries(nd).forEach(([qid, rVal]) => {
                      const rn = normalizeNote(rVal);
                      const ln = normalizeNote(merged[qid]);
                      if (!merged[qid] || rn.updatedAt > ln.updatedAt) merged[qid] = rn;
                    });
                    return merged;
                  });
                }
              }
            }
            safeSetLS(getUserKey(currentUser, "lastSyncAt"), Date.now());
            if (!silent) showToast("已增量同步云端最新个人进度与笔记！", "success");
          } else if (mode === "push") {
            const pushAll = !useKeepalive || dirtyProgRef.current || dirtyNotesRef.current;
            if (!pushAll) return;
            const nowMs = Date.now();
            const hdrs = getAuthHeaders(true);

            if (dirtyProgRef.current || !useKeepalive) {
              await fetch(`${baseUrl}/rest/v1/${TABLE_NAME}`, {
                method: "POST", headers: hdrs, keepalive: useKeepalive,
                body: JSON.stringify({ username: uProgKey, data: { attemptedMap, mistakes, markedIds, highlightsMap, dailyLogs, lastPosMap } })
              });
              dirtyProgRef.current = false;
            }
            if (dirtyNotesRef.current || !useKeepalive) {
              await fetch(`${baseUrl}/rest/v1/${TABLE_NAME}`, {
                method: "POST", headers: hdrs, keepalive: useKeepalive,
                body: JSON.stringify({ username: uNotesKey, data: { notesMap } })
              });
              dirtyNotesRef.current = false;
            }
            await fetch(`${baseUrl}/rest/v1/${TABLE_NAME}`, {
              method: "POST", headers: hdrs, keepalive: useKeepalive,
              body: JSON.stringify({ username: uMetaKey, data: { updatedAt: nowMs, progUpdatedAt: nowMs, notesUpdatedAt: nowMs } })
            });
            safeSetLS(getUserKey(currentUser, "lastSyncAt"), nowMs);
            setHasUnsynced(false);
            if (!silent) showToast("已将更改的部分增量同步至云端！", "success");
          }
        } catch {
          if (!silent) showToast("个人进度同步失败，请检查网络", "error");
        }
      }, [currentUser, userToken, attemptedMap, mistakes, markedIds, highlightsMap, dailyLogs, lastPosMap, notesMap]);

      // Exit confirmation + automatic keepalive push when closing tab
      useEffect(() => {
        const onBeforeUnload = (e) => {
          if (currentUser !== "guest" && (dirtyProgRef.current || dirtyNotesRef.current)) {
            syncUserProgress("push", true, true);
            e.preventDefault();
            e.returnValue = "";
          }
        };
        window.addEventListener("beforeunload", onBeforeUnload);
        return () => window.removeEventListener("beforeunload", onBeforeUnload);
      }, [currentUser, syncUserProgress]);

      // Startup: hash callback, auto-login, incremental global & user sync
      useEffect(() => {
        pullGlobalIncremental(false, true);
        pullSlidesIncremental(true);
        const hash = window.location.hash || "";
        if (hash.includes("access_token=")) {
          const params = new URLSearchParams(hash.replace(/^#/, ""));
          const accessToken = params.get("access_token");
          const hashType = params.get("type");
          if (accessToken) {
            const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
            (async () => {
              try {
                const uRes = await fetch(`${baseUrl}/auth/v1/user`, { headers: { "apikey": cloudCfg.anonKey, "Authorization": "Bearer " + accessToken } });
                const uData = await uRes.json();
                window.history.replaceState(null, "", window.location.pathname + window.location.search);
                if (uRes.ok && uData?.email) {
                  setUserToken(accessToken);
                  if (hashType === "recovery") {
                    setAuthEmail(uData.email); setRecoveryToken(accessToken); setAuthMode("reset");
                    showToast("已验证重置链接，请设置新密码", "success");
                  } else {
                    setCurrentUser(uData.email);
                    showToast(`邮箱激活成功，已自动登录：${uData.email}`, "success");
                  }
                }
              } catch {}
            })();
            return;
          }
        }
        if (currentUser !== "guest") {
          syncUserProgress("auto_pull", true);
          return;
        }
        if (manualLogoutRef.current) return;
        const cred = safeGetLS(SAVED_CRED_KEY, null);
        if (!cred?.autoLogin || !cred?.email || !cred?.pwdEnc) return;
        const pwd = decodeCred(cred.pwdEnc);
        if (!pwd || pwd.length < 6) return;
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        (async () => {
          setAuthBusy(true);
          try {
            const res = await fetch(`${baseUrl}/auth/v1/token?grant_type=password`, {
              method: "POST", headers: { "apikey": cloudCfg.anonKey, "Content-Type": "application/json" },
              body: JSON.stringify({ email: cred.email, password: pwd })
            });
            const data = await res.json();
            if (res.ok && (data.user?.email || cred.email)) {
              if (data.access_token) setUserToken(data.access_token); if (data.refresh_token) setRefreshToken(data.refresh_token);
              setCurrentUser(data.user?.email || cred.email);
              showToast(`已自动登录：${data.user?.email || cred.email}`, "success");
            }
          } catch {}
          finally { setAuthBusy(false); }
        })();
      }, []);

      // =========================================================================
      // 7. INVITE CODES & AUTH HANDLERS
      // =========================================================================
      const fetchInvites = async () => {
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        try {
          const res = await fetch(`${baseUrl}/rest/v1/${TABLE_NAME}?username=eq.${encodeURIComponent(INVITE_CLOUD_KEY)}&select=data`, { headers: getAuthHeaders(false) });
          if (res.ok) {
            const rows = await res.json();
            const codes = rows?.[0]?.data?.codes;
            if (Array.isArray(codes)) { setInviteList(codes); return codes; }
          }
        } catch {}
        return [];
      };

      const saveInvitesToCloud = async (codes) => {
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        const res = await restFetch(`${baseUrl}/rest/v1/${TABLE_NAME}`, {
          method: "POST",
          body: JSON.stringify({ username: INVITE_CLOUD_KEY, data: { codes, updatedAt: new Date().toISOString() } })
        });
        if (!res.ok) throw new Error(res.status === 401 ? "401 登录凭证已过期，请点右上角退出后重新登录一次" : ("HTTP " + res.status));
        setInviteList(codes);
      };

      const handleGenerateInvites = async () => {
        if (!isAdmin) return;
        setInviteBusy(true);
        try {
          const existing = await fetchInvites();
          const existingSet = new Set(existing.map(c => c.code));
          const count = Math.min(100, Math.max(1, Number(inviteGenCount) || 10));
          const created = [], nowStr = new Date().toLocaleString("zh-CN", { hour12: false });
          for (let i = 0; i < count; i++) {
            let code = generateInviteCodeString();
            while (existingSet.has(code)) code = generateInviteCodeString();
            existingSet.add(code);
            created.push({ code, status: "unused", createdAt: nowStr, note: inviteGenNote.trim() || "常规批次", usedBy: "", usedAt: "" });
          }
          await saveInvitesToCloud([...created, ...existing]);
          setInviteGenNote("");
          showToast(`成功生成 ${created.length} 个新邀请码！`, "success");
        } catch (e) { showToast("生成失败：" + e.message, "error"); }
        finally { setInviteBusy(false); }
      };

      useEffect(() => { if (showAdminModal && adminTab === "invites" && isAdmin) fetchInvites(); }, [showAdminModal, adminTab, isAdmin]);

      const sendEmailLink = async (mode) => {
        if (otpCooldown > 0) return;
        const email = authEmail.trim();
        if (!email || !email.includes("@")) { showToast("请输入有效的邮箱地址", "error"); return; }
        const isAdminEmail = email.toLowerCase() === "yangrch2@gmail.com";
        const codeInput = authInviteCode.trim().toUpperCase();
        let codes = [];
        if (mode === "register") {
          if (authPassword.length < 6) { showToast("密码至少 6 位", "error"); return; }
          if (!isAdminEmail) {
            if (!codeInput) { showToast("注册必须填写邀请码", "error"); return; }
            setAuthBusy(true);
            codes = await fetchInvites();
            const matched = codes.find(c => c.code.toUpperCase() === codeInput);
            if (!matched) { setAuthBusy(false); showToast("邀请码无效，请向管理员索取", "error"); return; }
            if (matched.status === "used") { setAuthBusy(false); showToast("该邀请码已被使用", "error"); return; }
          } else setAuthBusy(true);
        } else setAuthBusy(true);

        try {
          const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
          const redirectUrl = window.location.href.split("#")[0];
          const endpoint = mode === "register" ? "signup" : "recover";
          const body = mode === "register" ? { email, password: authPassword, options: { emailRedirectTo: redirectUrl } } : { email };
          const res = await fetch(`${baseUrl}/auth/v1/${endpoint}?redirect_to=${encodeURIComponent(redirectUrl)}`, {
            method: "POST", headers: { "apikey": cloudCfg.anonKey, "Content-Type": "application/json" }, body: JSON.stringify(body)
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.msg || data.error_description || data.message || ("HTTP " + res.status));
          if (mode === "register" && !isAdminEmail && codeInput) {
            const updatedCodes = codes.map(c => c.code.toUpperCase() === codeInput ? { ...c, status: "used", usedBy: email, usedAt: new Date().toLocaleString("zh-CN", { hour12: false }) } : c);
            await saveInvitesToCloud(updatedCodes).catch(() => {});
          }
          setOtpSent(true); setOtpCooldown(60);
          showToast(mode === "register" ? "激活邮件已发送，请去邮箱点击 Confirm 链接" : "重置密码邮件已发送", "success");
        } catch (err) { showToast("发送失败：" + (err.message || "请检查邮箱"), "error"); }
        finally { setAuthBusy(false); }
      };

      const handleAuthSubmit = async () => {
        const email = authEmail.trim();
        if (!email || !email.includes("@")) { showToast("请输入有效的邮箱地址", "error"); return; }
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        const headers = { "apikey": cloudCfg.anonKey, "Content-Type": "application/json" };
        setAuthBusy(true);
        try {
          if (authMode === "login") {
            if (authPassword.length < 6) throw new Error("密码至少 6 位");
            const res = await fetch(`${baseUrl}/auth/v1/token?grant_type=password`, { method: "POST", headers, body: JSON.stringify({ email, password: authPassword }) });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error_description || data.msg || "邮箱或密码错误");
            if (rememberPwd || autoLogin) safeSetLS(SAVED_CRED_KEY, { rememberPwd: true, autoLogin, email, pwdEnc: encodeCred(authPassword) });
            else safeSetLS(SAVED_CRED_KEY, { rememberPwd: false, autoLogin: false, email: "", pwdEnc: "" });
            manualLogoutRef.current = false;
            if (data.access_token) setUserToken(data.access_token); if (data.refresh_token) setRefreshToken(data.refresh_token);
            setCurrentUser(data.user?.email || email);
            pullGlobalIncremental(false, true);
            setShowAuthModal(false);
            if (!rememberPwd) setAuthPassword("");
            showToast(`登录成功！欢迎 ${email}`, "success");
          } else if (authMode === "register") {
            if (!otpSent) { setAuthBusy(false); await sendEmailLink("register"); return; }
            const res = await fetch(`${baseUrl}/auth/v1/token?grant_type=password`, { method: "POST", headers, body: JSON.stringify({ email, password: authPassword }) });
            const data = await res.json();
            if (!res.ok) throw new Error("尚未检测到邮箱激活，请先去邮箱点击 Confirm email address 链接");
            if (data.access_token) setUserToken(data.access_token); if (data.refresh_token) setRefreshToken(data.refresh_token);
            setCurrentUser(data.user?.email || email);
            setShowAuthModal(false); setAuthPassword(""); setAuthInviteCode(""); setOtpSent(false);
            showToast("注册激活成功！", "success");
          } else if (authMode === "reset") {
            if (!recoveryToken) { setAuthBusy(false); await sendEmailLink("reset"); return; }
            if (newResetPassword.length < 6) throw new Error("新密码至少 6 位");
            const uRes = await fetch(`${baseUrl}/auth/v1/user`, { method: "PUT", headers: { "apikey": cloudCfg.anonKey, "Authorization": "Bearer " + recoveryToken, "Content-Type": "application/json" }, body: JSON.stringify({ password: newResetPassword }) });
            if (!uRes.ok) throw new Error("新密码更新失败");
            setCurrentUser(email); setShowAuthModal(false); setRecoveryToken(""); setNewResetPassword(""); setAuthMode("login");
            showToast("密码重置成功！", "success");
          }
        } catch (err) { showToast(err.message || "操作失败", "error"); }
        finally { setAuthBusy(false); }
      };

      // =========================================================================
      // 8. FULL LOCAL JSON BACKUP & RESTORE
      // =========================================================================
      const exportFullLocalBackup = () => {
        const payload = {
          app: "YaKaoBang",
          exportedAt: new Date().toISOString(),
          user: currentUser,
          curriculum, questions,
          userState: { attemptedMap, mistakes, markedIds, notesMap, highlightsMap, dailyLogs, lastPosMap }
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `yakaobang_backup_${todayKey}.json`;
        a.click();
        showToast("已导出全量本地 JSON 备份！", "success");
      };

      const importFullLocalBackup = (file) => {
        if (!file) return;
        const r = new FileReader();
        r.onload = (ev) => {
          try {
            const d = JSON.parse(String(ev.target?.result || ""));
            if (d.userState) {
              if (d.userState.attemptedMap) setAttemptedMap(d.userState.attemptedMap);
              if (Array.isArray(d.userState.mistakes)) setMistakes(d.userState.mistakes);
              if (Array.isArray(d.userState.markedIds)) setMarkedIds(d.userState.markedIds);
              if (d.userState.notesMap) setNotesMap(d.userState.notesMap);
              if (d.userState.highlightsMap) setHighlightsMap(d.userState.highlightsMap);
              if (d.userState.dailyLogs) setDailyLogs(d.userState.dailyLogs);
              if (d.userState.lastPosMap) setLastPosMap(d.userState.lastPosMap);
              markProgDirty(); markNotesDirty();
            }
            if (isAdmin && d.curriculum && Array.isArray(d.questions)) {
              setCurriculum(d.curriculum); setQuestions(d.questions);
            }
            showToast("已从本地备份文件恢复数据！", "success");
          } catch { showToast("备份文件格式无效", "error"); }
        };
        r.readAsText(file);
      };

      // =========================================================================
      // 9. PRACTICE LOGIC (4 MODES + 3 QUESTION TYPES)
      // =========================================================================
      const activeChapter = useMemo(() => curriculum.chapters.find(c => c.id === activeChapterId) || null, [curriculum.chapters, activeChapterId]);
      const activeChapterQuestions = useMemo(() => questions.filter(q => q.chapterId === activeChapterId), [questions, activeChapterId]);

      const getChapterLabel = useCallback((chId) => {
        const ch = curriculum.chapters.find(c => c.id === chId);
        if (!ch) return "未分类章节";
        const sub = curriculum.subjects.find(s => s.id === ch.subjectId);
        const sem = sub ? curriculum.semesters.find(x => x.id === sub.semesterId) : null;
        return `${sem ? sem.name + " · " : ""}${sub ? sub.name + " · " : ""}${ch.name}`;
      }, [curriculum]);

      const startChapterSession = (chapterId, mode, filterType = "all", startQid = null) => {
        const chQs = questions.filter(q => q.chapterId === chapterId);
        let targetQs = chQs;
        if (filterType === "unused") targetQs = chQs.filter(q => !attemptedMap[q.id]);
        else if (filterType === "wrong") targetQs = chQs.filter(q => attemptedMap[q.id] && !attemptedMap[q.id].lastCorrect);
        if (targetQs.length === 0) { showToast("当前筛选条件下暂无题目", "info"); return; }
        let startIdx = 0;
        if (startQid) {
          const foundIdx = targetQs.findIndex(q => q.id === startQid);
          if (foundIdx >= 0) startIdx = foundIdx;
        }
        setSession({ chapterId, mode, qIds: targetQs.map(q => q.id), currentIndex: startIdx, choiceAnswers: {}, blankAnswers: {}, caseAnswers: {}, submitted: {}, elapsedSec: 0, testSubmitted: false });
        setView("PRACTICE");
      };

      const evaluateQuestion = (q, sess) => {
        if (q.type === "choice") {
          const ans = sess.choiceAnswers[q.id] || "";
          if (!ans) return false;
          const norm = (s) => String(s).toUpperCase().split("").filter(c => /[A-Z]/.test(c)).sort().join("");
          return norm(ans) === norm(q.answer);
        }
        if (q.type === "blank") {
          const uB = sess.blankAnswers[q.id] || [], exp = q.blanks || [];
          return exp.length > 0 && exp.every((e, i) => checkBlankMatch(uB[i], e));
        }
        if (q.type === "case") {
          const subs = q.subQuestions || [], uSubs = sess.caseAnswers[q.id] || {};
          const choiceSubs = subs.map((s, idx) => ({ s, idx })).filter(x => x.s.type === "choice");
          if (choiceSubs.length === 0) return true;
          return choiceSubs.every(({ s, idx }) => {
            const norm = (str) => String(str || "").toUpperCase().split("").filter(c => /[A-Z]/.test(c)).sort().join("");
            return norm(uSubs[idx]) === norm(s.answer);
          });
        }
        return false;
      };

      const commitQuestionResult = (q, isCorrect) => {
        setAttemptedMap(prev => ({ ...prev, [q.id]: { lastCorrect: isCorrect, count: (prev[q.id]?.count || 0) + 1 } }));
        setLastPosMap(prev => ({ ...prev, [q.chapterId]: q.id }));
        const dk = getStudyDateKey();
        const chLabel = getChapterLabel(q.chapterId);
        setDailyLogs(prev => {
          const cur = prev[dk] || { studySec: 0, qCount: 0, qCorrect: 0, tasks: {} };
          const tasks = { ...(cur.tasks || {}) };
          tasks[chLabel] = (tasks[chLabel] || 0) + 1;
          return { ...prev, [dk]: { ...cur, qCount: (cur.qCount || 0) + 1, qCorrect: (cur.qCorrect || 0) + (isCorrect ? 1 : 0), tasks } };
        });
        if (!isCorrect) {
          const nowMs = Date.now();
          setMistakes(prev => {
            const existing = prev.find(m => m.id === q.id);
            const rec = { id: q.id, wrongCount: existing ? (existing.wrongCount || 1) + 1 : 1, lastWrongAt: nowMs, fsrs: existing?.fsrs ? fsrsSchedule(existing.fsrs, 1, nowMs) : createInitialFSRS(nowMs) };
            return [rec, ...prev.filter(m => m.id !== q.id)];
          });
        }
        markProgDirty();
      };

      const submitSingleInSession = (q, overrideChoice = null) => {
        if (!session) return;
        const updatedSess = overrideChoice !== null ? { ...session, choiceAnswers: { ...session.choiceAnswers, [q.id]: overrideChoice }, submitted: { ...session.submitted, [q.id]: true } } : { ...session, submitted: { ...session.submitted, [q.id]: true } };
        const isCorrect = evaluateQuestion(q, updatedSess);
        setSession(updatedSess);
        if (!session.submitted[q.id]) commitQuestionResult(q, isCorrect);
      };

      const submitEntireTestExam = () => {
        if (!session) return;
        const newSub = { ...session.submitted };
        let correctCnt = 0;
        session.qIds.forEach(qid => {
          const q = questions.find(item => item.id === qid);
          if (!q) return;
          const isCorrect = evaluateQuestion(q, session);
          if (isCorrect) correctCnt++;
          if (!newSub[qid]) { commitQuestionResult(q, isCorrect); newSub[qid] = true; }
        });
        setSession(prev => ({ ...prev, submitted: newSub, testSubmitted: true, testCorrectCount: correctCnt }));
        setView("TEST_RESULT");
      };

      const dueMistakes = useMemo(() => {
        const now = Date.now();
        const validQMap = new Map(questions.map(q => [q.id, q]));
        return mistakes.filter(m => validQMap.has(m.id) && (!m.fsrs || (m.fsrs.due || 0) <= now)).map(m => ({ ...m, question: validQMap.get(m.id) }));
      }, [mistakes, questions]);

      // Global Search Results
      const dashSearchResults = useMemo(() => {
        const kw = dashSearchQuery.trim().toLowerCase();
        if (!kw) return [];
        return questions.filter(q => {
          const note = normalizeNote(notesMap[q.id]);
          return (q.stem || "").toLowerCase().includes(kw) || (q.explanation || "").toLowerCase().includes(kw) || (q.keyPoint || "").toLowerCase().includes(kw) || note.text.toLowerCase().includes(kw);
        }).slice(0, 30);
      }, [dashSearchQuery, questions, notesMap]);

      // Note Helpers
      const updateQuestionNote = (qid, patch) => {
        setNotesMap(prev => {
          const cur = normalizeNote(prev[qid]);
          return { ...prev, [qid]: { ...cur, ...patch, updatedAt: Date.now() } };
        });
        markNotesDirty();
      };

      const handleAttachNoteImage = async (qid, file) => {
        if (!file) return;
        try {
          const dataUri = await compressImageFile(file);
          const cur = normalizeNote(notesMap[qid]);
          updateQuestionNote(qid, { images: [...cur.images, dataUri] });
          showToast("图片已压缩并添加至笔记！", "success");
        } catch { showToast("图片处理失败", "error"); }
      };

      // Admin CRUD
      const addSemester = () => { if (!newSemName.trim()) return; setCurriculum(p => ({ ...p, semesters: [...p.semesters, { id: `sem_${Date.now()}`, name: newSemName.trim(), order: p.semesters.length + 1 }] })); setNewSemName(""); showToast("已添加大类", "success"); };
      const addSubject = () => { if (!newSubName.trim() || !newSubSemId) return; setCurriculum(p => ({ ...p, subjects: [...p.subjects, { id: `sub_${Date.now()}`, semesterId: newSubSemId, name: newSubName.trim(), desc: "课内学科", order: p.subjects.length + 1 }] })); setNewSubName(""); showToast("已添加学科", "success"); };
      const addChapter = () => { if (!newChName.trim() || !newChSubId) return; setCurriculum(p => ({ ...p, chapters: [...p.chapters, { id: `ch_${Date.now()}`, subjectId: newChSubId, name: newChName.trim(), order: p.chapters.length + 1 }] })); setNewChName(""); showToast("已添加章节", "success"); };
      const saveEditedNode = () => {
        if (!editingNode || !editingNode.name.trim()) return;
        if (editingNode.kind === "sem") setCurriculum(p => ({ ...p, semesters: p.semesters.map(s => s.id === editingNode.id ? { ...s, name: editingNode.name.trim() } : s) }));
        else if (editingNode.kind === "sub") setCurriculum(p => ({ ...p, subjects: p.subjects.map(s => s.id === editingNode.id ? { ...s, name: editingNode.name.trim() } : s) }));
        else if (editingNode.kind === "ch") setCurriculum(p => ({ ...p, chapters: p.chapters.map(c => c.id === editingNode.id ? { ...c, name: editingNode.name.trim() } : c) }));
        setEditingNode(null);
      };
      const deleteSemester = (semId) => {
        const subIds = new Set(curriculum.subjects.filter(s => s.semesterId === semId).map(s => s.id));
        const chIds = new Set(curriculum.chapters.filter(c => subIds.has(c.subjectId)).map(c => c.id));
        setCurriculum(p => ({ ...p, semesters: p.semesters.filter(s => s.id !== semId), subjects: p.subjects.filter(s => s.semesterId !== semId), chapters: p.chapters.filter(c => !subIds.has(c.subjectId)) }));
        setQuestions(p => p.filter(q => !chIds.has(q.chapterId)));
      };
      const deleteSubject = (subId) => {
        const chIds = new Set(curriculum.chapters.filter(c => c.subjectId === subId).map(c => c.id));
        setCurriculum(p => ({ ...p, subjects: p.subjects.filter(s => s.id !== subId), chapters: p.chapters.filter(c => c.subjectId !== subId) }));
        setQuestions(p => p.filter(q => !chIds.has(q.chapterId)));
      };
      const deleteChapter = (chId) => {
        setCurriculum(p => ({ ...p, chapters: p.chapters.filter(c => c.id !== chId) }));
        setQuestions(p => p.filter(q => q.chapterId !== chId));
      };
      const handleSaveManualQuestion = () => {
        if (!isAdmin || !qChapterId || !qStem.trim()) { showToast("请选择章节并填写题干", "error"); return; }
        let newQ = { id: `q_${Date.now()}`, chapterId: qChapterId, type: qType, stem: qStem.trim(), image: qImg || undefined, explanation: qExp.trim(), keyPoint: qKeyPoint.trim() };
        if (qType === "choice") {
          const cleanOpts = {}; Object.entries(qOpts).forEach(([k, v]) => { if (v.trim()) cleanOpts[k] = v.trim(); });
          if (Object.keys(cleanOpts).length < 2) { showToast("请至少填写 2 个选项", "error"); return; }
          newQ = { ...newQ, isMultiple: qIsMultiple, options: cleanOpts, answer: qChoiceAns.trim().toUpperCase() || "A" };
        } else if (qType === "blank") {
          const blanks = qBlanksStr.split("\n").map(s => s.trim()).filter(Boolean);
          if (blanks.length === 0) { showToast("请填写填空答案", "error"); return; }
          newQ = { ...newQ, blanks };
        } else if (qType === "case") {
          const validSubs = qCaseSubs.filter(s => s.stem.trim());
          if (validSubs.length === 0) { showToast("请至少填写 1 个案例子问题", "error"); return; }
          newQ = { ...newQ, subQuestions: validSubs };
        }
        setQuestions(prev => [newQ, ...prev]);
        setQStem(""); setQImg(""); setQOpts({ A: "", B: "", C: "", D: "", E: "" }); setQBlanksStr(""); setQExp(""); setQKeyPoint("");
        showToast("题目已录入！记得点击“发布并强制同步至全端”", "success");
      };
      const parseImportJson = (rawText) => {
        try {
          const parsed = JSON.parse((rawText || impJsonText).trim());
          const arr = Array.isArray(parsed) ? parsed : [parsed];
          const valid = arr.filter(q => q && q.stem).map((q, idx) => {
            const type = ["choice", "blank", "case"].includes(q.type) ? q.type : "choice";
            const targetCh = curriculum.chapters.some(c => c.id === q.chapterId) ? q.chapterId : impChapterId;
            return {
              id: q.id || `q_imp_${Date.now()}_${idx}`, chapterId: targetCh, type,
              isMultiple: Boolean(q.isMultiple || (q.answer && String(q.answer).length > 1 && type === "choice")),
              stem: String(q.stem).trim(), image: q.image || q.vignetteImage || undefined, options: q.options || undefined,
              answer: q.answer ? String(q.answer).trim().toUpperCase() : undefined,
              blanks: Array.isArray(q.blanks) ? q.blanks : undefined,
              subQuestions: Array.isArray(q.subQuestions) ? q.subQuestions : undefined,
              explanation: q.explanation || q.generalExplanation || "", keyPoint: q.keyPoint || q.educationalObjective || ""
            };
          });
          if (valid.length === 0) { showToast("未识别到有效题目", "error"); return; }
          setImpPreview(valid);
        } catch { showToast("JSON 格式有误", "error"); }
      };

      const formatTime = (sec) => `${String(Math.floor((sec || 0) / 60)).padStart(2, "0")}:${String((sec || 0) % 60).padStart(2, "0")}`;

      // =========================================================================
      // 10. RENDER
      // =========================================================================
      return (
        <div className={`min-h-screen flex flex-col ${darkMode && view === "PRACTICE" ? "bg-slate-950 text-slate-100" : "bg-slate-100 text-slate-900"}`}>
          {toast && (
            <div className={`fixed top-14 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl shadow-xl text-xs sm:text-sm font-semibold flex items-center gap-2 border ${
              toast.type === "error" ? "bg-rose-600 text-white border-rose-400" :
              toast.type === "success" ? "bg-emerald-600 text-white border-emerald-400" : "bg-slate-800 text-white border-slate-600"
            }`}>
              <Icon name={toast.type === "error" ? "alert" : "sparkles"} className="w-4 h-4 shrink-0" />
              <span>{toast.msg}</span>
            </div>
          )}

          {/* LOGIN GATE */}
          {currentUser === "guest" ? (
            <div className="flex-1 min-h-screen bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-white text-slate-900 rounded-2xl shadow-2xl p-6 sm:p-8 space-y-5">
                <div className="text-center space-y-2">
                  <div className="w-14 h-14 mx-auto rounded-2xl bg-blue-700 text-white flex items-center justify-center font-black text-2xl shadow-lg">鸭</div>
                  <h1 className="text-xl font-extrabold text-slate-900">鸭考帮 · 课内医学刷题系统</h1>
                  <p className="text-xs text-slate-500">支持 IndexedDB 大容量存储 · 增量云同步 · 凭邀请码注册</p>
                </div>
                <div className="flex gap-2 text-xs">
                  <button onClick={() => { setAuthMode("login"); setOtpSent(false); }} className={`flex-1 py-2 rounded-lg font-bold ${authMode === "login" ? "bg-blue-700 text-white" : "bg-slate-100 text-slate-600"}`}>登录</button>
                  <button onClick={() => { setAuthMode("register"); setOtpSent(false); }} className={`flex-1 py-2 rounded-lg font-bold ${authMode === "register" ? "bg-emerald-600 text-white" : "bg-slate-100 text-slate-600"}`}>邀请码注册</button>
                  <button onClick={() => { setAuthMode("reset"); setOtpSent(false); }} className={`flex-1 py-2 rounded-lg font-bold ${authMode === "reset" ? "bg-amber-600 text-white" : "bg-slate-100 text-slate-600"}`}>忘记密码</button>
                </div>
                <div className="space-y-3 text-xs">
                  {authMode === "register" && <input type="text" value={authInviteCode} onChange={(e) => setAuthInviteCode(e.target.value.toUpperCase())} placeholder="输入专属邀请码（如 YKB-XXXX-XXXX）" className="w-full border-2 border-emerald-300 bg-emerald-50/40 rounded-xl px-3.5 py-2.5 text-sm font-mono font-bold uppercase" />}
                  <input type="email" value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} placeholder="输入邮箱地址" className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm" />
                  {authMode !== "reset" && <input type="password" value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} placeholder="密码 (至少 6 位)" className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm" />}
                  {authMode === "register" && otpSent && (
                    <div className="p-3 rounded-xl bg-emerald-50 border border-emerald-300 text-emerald-900 space-y-1.5">
                      <div className="font-bold">✅ 激活邮件已发送至 {authEmail}</div>
                      <p>请前往邮箱点击 <strong>Confirm email address</strong> 链接激活，再点击下方按钮直接登录。</p>
                    </div>
                  )}
                  {authMode === "reset" && (
                    <div className="space-y-2 p-3 rounded-xl bg-slate-50 border border-slate-200">
                      {recoveryToken ? <input type="password" value={newResetPassword} onChange={(e) => setNewResetPassword(e.target.value)} placeholder="输入新密码 (至少 6 位)" className="w-full border rounded-lg px-3 py-2 bg-white" /> : <p className="text-slate-600">{otpSent ? "重置密码邮件已发送，请去邮箱点击重置链接。" : "输入注册邮箱后点击下方按钮发送重置链接。"}</p>}
                    </div>
                  )}
                  {authMode === "login" && (
                    <div className="flex items-center justify-between pt-1 text-xs text-slate-600">
                      <label className="flex items-center gap-1.5 cursor-pointer select-none"><input type="checkbox" checked={rememberPwd} onChange={(e) => { setRememberPwd(e.target.checked); if (!e.target.checked) setAutoLogin(false); }} className="accent-blue-700 w-3.5 h-3.5" /><span>记住密码</span></label>
                      <label className="flex items-center gap-1.5 cursor-pointer select-none"><input type="checkbox" checked={autoLogin} onChange={(e) => { setAutoLogin(e.target.checked); if (e.target.checked) setRememberPwd(true); }} className="accent-blue-700 w-3.5 h-3.5" /><span>自动登录</span></label>
                    </div>
                  )}
                  <button disabled={authBusy} onClick={handleAuthSubmit} className="w-full py-3 rounded-xl bg-blue-700 hover:bg-blue-600 text-white font-extrabold text-sm shadow-lg">
                    {authBusy ? "处理中..." : authMode === "register" ? (otpSent ? "我已点击邮件链接，立即登录" : "验证邀请码并发送激活邮件") : authMode === "reset" ? (recoveryToken ? "确认重设密码" : "发送密码重置邮件") : "登录进入鸭考帮"}
                  </button>
                </div>
              </div>
            </div>
          ) : (
            <>
              {/* VIEW 1: DASHBOARD */}
              {view === "DASHBOARD" && (
                <>
                  <header className="bg-blue-900 text-white shadow-md px-4 sm:px-6 py-3">
                    <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                      <div className="flex items-center gap-3">
                        <div className="w-9 h-9 rounded-lg bg-blue-600 border border-blue-400 flex items-center justify-center font-black text-base shadow">鸭</div>
                        <div>
                          <h1 className="font-bold text-base sm:text-lg leading-tight">鸭考帮 · 课内医学 QBank</h1>
