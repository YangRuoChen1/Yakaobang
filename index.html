    function computeCheckInStats(dailyLogs) {

      });

    // =========================================================================
    // 4. FSRS ENGINE (FOR WRONG QUESTIONS)

    const FSRS_DEFAULTS = {
      w: [0.4, 0.6, 2.4, 5.8, 4.93, 0.94, 0.86, 0.01, 1.49, 0.14, 0.94, 2.18, 0.05, 0.34, 1.26, 0.29, 2.61],
      DECAY: -0.5,
      FACTOR: 19 / 81
    };
    function createInitialFSRS(nowMs = Date.now()) {
      return { state: "New", stability: 0.4, difficulty: 5.0, elapsedDays: 0, scheduledDays: 0, reps: 0, lapses: 0, lastReview: nowMs, due: nowMs };
    }
    function fsrsSchedule(cardFsrs, grade, targetRetention = 0.90, nowMs = Date.now()) {
      const w = FSRS_DEFAULTS.w;
      const f = cardFsrs || createInitialFSRS(nowMs);
      const elapsedDays = f.lastReview ? Math.max(0, (nowMs - f.lastReview) / 86400000) : 0;
      const clampD = (d) => Math.min(10, Math.max(1, d));
      const nextIvl = (s) => Math.max(1, Math.round((s / FSRS_DEFAULTS.FACTOR) * (Math.pow(0.90, 1 / FSRS_DEFAULTS.DECAY) - 1)));
      let nextS = f.stability, nextD = f.difficulty, nextState = f.state, nextLapses = f.lapses || 0, nextDays = 1, dueMs = nowMs;
      if (f.reps === 0 || f.state === "New") {
        nextD = clampD(w[4] - Math.exp(w[5] * (grade - 1)) + 1);
        nextS = Math.max(0.1, w[grade - 1]);
        if (grade === 1) { nextState = "Learning"; nextDays = 0; dueMs = nowMs + 600000; }
        else if (grade === 2) { nextState = "Learning"; nextDays = 0.5; dueMs = nowMs + 43200000; }
        else { nextState = "Review"; nextDays = nextIvl(nextS); dueMs = nowMs + nextDays * 86400000; }
      } else {
        const R = f.stability > 0 ? Math.pow(1 + FSRS_DEFAULTS.FACTOR * (elapsedDays / f.stability), FSRS_DEFAULTS.DECAY) : 0;
        nextD = clampD(w[7] * w[4] + (1 - w[7]) * clampD(f.difficulty - w[6] * (grade - 3)));
        if (grade === 1) {
          nextLapses += 1; nextState = "Relearning";
          nextS = Math.max(0.2, w[11] * Math.pow(nextD, -w[12]) * (Math.pow(f.stability + 1, w[13]) - 1) * Math.exp(w[14] * (1 - R)));
          nextDays = 0; dueMs = nowMs + 600000;
        } else {
          nextS = f.stability * (1 + Math.exp(w[8]) * (11 - nextD) * Math.pow(f.stability, -w[9]) * (Math.exp(w[10] * (1 - R)) - 1) * (grade === 2 ? w[15] : 1) * (grade === 4 ? w[16] : 1));
          nextState = "Review"; nextDays = nextIvl(nextS); dueMs = nowMs + nextDays * 86400000;
        }
      }
      return { state: nextState, stability: Number(nextS.toFixed(2)), difficulty: Number(nextD.toFixed(2)), elapsedDays: Number(elapsedDays.toFixed(2)), scheduledDays: nextDays, reps: (f.reps || 0) + 1, lapses: nextLapses, lastReview: nowMs, due: dueMs };
    }
    function formatFsrsInterval(nextFsrs, nowMs = Date.now()) {
      const diffMin = Math.round((nextFsrs.due - nowMs) / 60000);
      if (diffMin < 60) return `${Math.max(1, diffMin)} 分钟`;
      const diffHours = Math.round(diffMin / 60);
      if (diffHours < 24) return `${diffHours} 小时`;
      return `${Math.round(diffHours / 24)} 天`;
    }

    function checkBlankMatch(userVal, expectedStr) {
      const u = String(userVal || "").trim().toLowerCase().replace(/\s+/g, "");
      if (!u) return false;
      const alts = String(expectedStr || "").split(/[\/｜|]/).map(s => s.trim().toLowerCase().replace(/\s+/g, "")).filter(Boolean);
      return alts.includes(u);
    }

    function renderHighlightedText(text, highlights = []) {
      if (!text) return null;
      if (!highlights || highlights.length === 0) return text;
      const escaped = highlights.filter(Boolean).map(h => h.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
      if (escaped.length === 0) return text;
      const parts = text.split(new RegExp(`(${escaped.join("|")})`, "g"));
      return parts.map((part, idx) => highlights.includes(part) ? <mark key={idx} className="ykb-hl">{part}</mark> : <React.Fragment key={idx}>{part}</React.Fragment>);
    }

    function copyTextSafe(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
        return;
      }
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch {}
      document.body.removeChild(ta);
    }

      // Study Time Tracker (03:00 AM - 03:00 AM boundary)

      const todayKey = getStudyDateKey();

      const todayAccuracy = todayStats.qCount > 0 ? Math.round((todayStats.qCorrect / todayStats.qCount) * 100) : null;
      const checkInStats = useMemo(() => computeCheckInStats(dailyLogs), [dailyLogs]);

      // =========================================================================
      // 7. FORCE SYNC WITH ADMIN GLOBAL CLOUD BANK & AUTO-LOGIN
      // =========================================================================
      const pullGlobalForced = useCallback(async (silent = false) => {
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        const hdrs = { "apikey": cloudCfg.anonKey, "Authorization": "Bearer " + cloudCfg.anonKey };

        try {
          const res = await fetch(`${baseUrl}/rest/v1/medspire_saves?username=eq.${encodeURIComponent(GLOBAL_CLOUD_KEY)}&select=data`, { headers: hdrs });
          if (res.ok) {
            const rows = await res.json();
            const payload = rows?.[0]?.data;
            if (payload && payload.curriculum && Array.isArray(payload.questions)) {
              setCurriculum(payload.curriculum);
              setQuestions(payload.questions);
              if (!silent) showToast(`已强制同步最新题库：${payload.curriculum.subjects.length} 学科 · ${payload.questions.length} 题`, "success");
            } else if (!silent) {
              showToast("云端暂无已发布的全局题库，当前使用本地数据", "info");
            }
          }
        } catch {
          if (!silent) showToast("同步检查失败，请检查网络", "error");
        } finally {
          setSyncStatus(null);
        }
      }, []);

      const publishGlobalForced = async () => {
        if (!isAdmin) return;
        setCloudBusy(true);
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        try {
          const nextCur = { ...curriculum, version: Date.now() };
          setCurriculum(nextCur);
          const res = await fetch(`${baseUrl}/rest/v1/medspire_saves`, {
            method: "POST",
            headers: { "apikey": cloudCfg.anonKey, "Authorization": "Bearer " + cloudCfg.anonKey, "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates" },
            body: JSON.stringify({
              username: GLOBAL_CLOUD_KEY,
              data: { curriculum: nextCur, questions, updatedAt: new Date().toISOString(), updatedBy: currentUser }
            })
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          showToast(`已发布！全端同学端下次打开/刷新将强制同步这 ${questions.length} 题与最新课程结构`, "success");
        } catch (e) {
          showToast("发布失败：" + e.message, "error");
        } finally {
          setCloudBusy(false);
        }
      };

      // Startup auto-login & forced global sync
      useEffect(() => {
        pullGlobalForced(true);
        if (currentUser !== "guest" || manualLogoutRef.current) return;
        const cred = safeGetStorage(SAVED_CRED_KEY, null);
        if (!cred?.autoLogin || !cred?.email || !cred?.pwdEnc) return;
        const pwd = decodeCred(cred.pwdEnc);
        if (!pwd || pwd.length < 6) return;
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        (async () => {
          setAuthBusy(true);
          try {
            const res = await fetch(`${baseUrl}/auth/v1/token?grant_type=password`, {
              method: "POST",
              headers: { "apikey": cloudCfg.anonKey, "Content-Type": "application/json" },
              body: JSON.stringify({ email: cred.email, password: pwd })
            });
            const data = await res.json();
            if (res.ok && (data.user?.email || cred.email)) {
              switchToUser(data.user?.email || cred.email);
              showToast(`已自动登录：${data.user?.email || cred.email}`, "success");
            }
          } catch {}
          finally { setAuthBusy(false); }
        })();
      }, []);

      // =========================================================================
      // 8. INVITE CODE MANAGEMENT & AUTHENTICATION
      // =========================================================================
      const fetchInvites = async () => {
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        const hdrs = { "apikey": cloudCfg.anonKey, "Authorization": "Bearer " + cloudCfg.anonKey };
        try {
          const res = await fetch(`${baseUrl}/rest/v1/medspire_saves?username=eq.${encodeURIComponent(INVITE_CLOUD_KEY)}&select=data`, { headers: hdrs });
          if (res.ok) {
            const rows = await res.json();
            const codes = rows?.[0]?.data?.codes;
            if (Array.isArray(codes)) {
              setInviteList(codes);
              return codes;
            }
          }
        } catch {}
        return [];
      };

      const saveInvitesToCloud = async (codes) => {
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        const res = await fetch(`${baseUrl}/rest/v1/medspire_saves`, {
          method: "POST",
          headers: { "apikey": cloudCfg.anonKey, "Authorization": "Bearer " + cloudCfg.anonKey, "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates" },
          body: JSON.stringify({ username: INVITE_CLOUD_KEY, data: { codes, updatedAt: new Date().toISOString() } })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        setInviteList(codes);
      };

      const handleGenerateInvites = async () => {
        if (!isAdmin) return;
        setInviteBusy(true);
        try {
          const existing = await fetchInvites();
          const existingSet = new Set(existing.map(c => c.code));
          const count = Math.min(100, Math.max(1, Number(inviteGenCount) || 10));
          const created = [];
          const nowStr = new Date().toLocaleString("zh-CN", { hour12: false });
          for (let i = 0; i < count; i++) {
            let code = generateInviteCodeString();
            while (existingSet.has(code)) code = generateInviteCodeString();
            existingSet.add(code);
            created.push({ code, status: "unused", createdAt: nowStr, note: inviteGenNote.trim() || "常规批次", usedBy: "", usedAt: "" });
          }
          await saveInvitesToCloud([...created, ...existing]);
          setInviteGenNote("");
          showToast(`成功生成 ${created.length} 个新邀请码并同步云端！`, "success");
        } catch (e) {
          showToast("生成邀请码失败：" + e.message, "error");
        } finally {
          setInviteBusy(false);

      const sendEmailOtp = async (mode) => {
        if (otpCooldown > 0) return;
        const email = authEmail.trim();
        if (!email || !email.includes("@")) { showToast("请输入有效的邮箱地址", "error"); return; }
        if (mode === "register") {
          if (authPassword.length < 6) { showToast("密码至少 6 位", "error"); return; }
          const codeInput = authInviteCode.trim().toUpperCase();
          if (!codeInput) { showToast("注册必须填写邀请码", "error"); return; }
          setAuthBusy(true);
          const codes = await fetchInvites();
          const matched = codes.find(c => c.code.toUpperCase() === codeInput);
          if (!matched) { setAuthBusy(false); showToast("邀请码无效，请向管理员索取", "error"); return; }
          if (matched.status === "used") { setAuthBusy(false); showToast("该邀请码已被使用，请更换新邀请码", "error"); return; }
        } else {
          setAuthBusy(true);
        }

        try {
          const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
          const headers = { "apikey": cloudCfg.anonKey, "Content-Type": "application/json" };
          const endpoint = mode === "register" ? "signup" : "recover";
          const body = mode === "register" ? { email, password: authPassword } : { email };
          const res = await fetch(`${baseUrl}/auth/v1/${endpoint}`, { method: "POST", headers, body: JSON.stringify(body) });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.msg || data.error_description || data.message || ("HTTP " + res.status));
          setOtpSent(true); setOtpCooldown(60);
          showToast("验证码已发送至邮箱，请查收！", "success");
        } catch (err) {
          showToast("发送失败：" + (err.message || "请检查邮箱"), "error");
        } finally {
          setAuthBusy(false);
        }
      };

      const handleAuthSubmit = async () => {
        const email = authEmail.trim();
        if (!email || !email.includes("@")) { showToast("请输入有效的邮箱地址", "error"); return; }
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        const headers = { "apikey": cloudCfg.anonKey, "Content-Type": "application/json" };
        setAuthBusy(true);
        try {
          if (authMode === "login") {
            if (authPassword.length < 6) throw new Error("密码至少 6 位");
            const res = await fetch(`${baseUrl}/auth/v1/token?grant_type=password`, { method: "POST", headers, body: JSON.stringify({ email, password: authPassword }) });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error_description || data.msg || "邮箱或密码错误");
            if (rememberPwd || autoLogin) {
              safeSetStorage(SAVED_CRED_KEY, { rememberPwd: true, autoLogin, email, pwdEnc: encodeCred(authPassword) });
            } else {
              safeSetStorage(SAVED_CRED_KEY, { rememberPwd: false, autoLogin: false, email: "", pwdEnc: "" });
            }
            manualLogoutRef.current = false;
            switchToUser(data.user?.email || email);
            pullGlobalForced(true);
            setShowAuthModal(false);
            if (!rememberPwd) setAuthPassword("");
            showToast(`登录成功！欢迎 ${email}`, "success");
          } else if (authMode === "register") {
            const codeInput = authInviteCode.trim().toUpperCase();
            if (!codeInput) throw new Error("请填写有效邀请码");
            if (!authOtp.trim()) throw new Error("请先输入邮箱验证码");
            const codes = await fetchInvites();
            const matched = codes.find(c => c.code.toUpperCase() === codeInput);
            if (!matched || matched.status === "used") throw new Error("邀请码无效或已被他人使用");

            const res = await fetch(`${baseUrl}/auth/v1/verify`, { method: "POST", headers, body: JSON.stringify({ type: "signup", email, token: authOtp.trim() }) });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error_description || data.msg || "验证码错误");

            // Mark invite code as used
            const updatedCodes = codes.map(c => c.code.toUpperCase() === codeInput ? {
              ...c, status: "used", usedBy: email, usedAt: new Date().toLocaleString("zh-CN", { hour12: false })
            } : c);
            await saveInvitesToCloud(updatedCodes).catch(() => {});

            switchToUser(data.user?.email || email);
            pullGlobalForced(true);
            setShowAuthModal(false); setAuthPassword(""); setAuthOtp(""); setAuthInviteCode(""); setOtpSent(false);
            showToast("邀请码核销并注册成功！", "success");
          } else if (authMode === "reset") {
            if (!authOtp.trim() || newResetPassword.length < 6) throw new Error("请输入验证码与至少 6 位新密码");
            const vRes = await fetch(`${baseUrl}/auth/v1/verify`, { method: "POST", headers, body: JSON.stringify({ type: "recovery", email, token: authOtp.trim() }) });
            const vData = await vRes.json();
            if (!vRes.ok || !vData.access_token) throw new Error("验证码无效或已过期");
            const uRes = await fetch(`${baseUrl}/auth/v1/user`, { method: "PUT", headers: { "apikey": cloudCfg.anonKey, "Authorization": "Bearer " + vData.access_token, "Content-Type": "application/json" }, body: JSON.stringify({ password: newResetPassword }) });
            if (!uRes.ok) throw new Error("新密码更新失败");
            switchToUser(email);
            setShowAuthModal(false); setAuthOtp(""); setNewResetPassword(""); setAuthMode("login");
            showToast("密码重置成功！", "success");
          }
        } catch (err) {
          showToast(err.message || "操作失败", "error");
        } finally {
          setAuthBusy(false);
        }
      };

      const syncUserPersonalSave = async (direction) => {

        setCloudBusy(true);
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");

                username: saveKey,
                data: { attemptedMap, mistakes, markedIds, notesMap, highlightsMap, dailyLogs, lastPosMap, updatedAt: new Date().toISOString() }
              })

            showToast("个人刷题进度、错题与打卡记录已同步至云端！", "success");
          } else {
            const res = await fetch(`${baseUrl}/rest/v1/medspire_saves?username=eq.${encodeURIComponent(saveKey)}&select=data`, {
              headers: { "apikey": cloudCfg.anonKey, "Authorization": "Bearer " + cloudCfg.anonKey }
            });
            if (!res.ok) throw new Error("HTTP " + res.status);
            const rows = await res.json();
            const d = rows?.[0]?.data;
            if (!d) { showToast("云端暂无个人进度存档", "info"); return; }
            if (d.attemptedMap) setAttemptedMap(d.attemptedMap);
            if (Array.isArray(d.mistakes)) setMistakes(d.mistakes);
            if (Array.isArray(d.markedIds)) setMarkedIds(d.markedIds);
            if (d.notesMap) setNotesMap(d.notesMap);
            if (d.highlightsMap) setHighlightsMap(d.highlightsMap);
            if (d.dailyLogs) setDailyLogs(d.dailyLogs);
            if (d.lastPosMap) setLastPosMap(d.lastPosMap);
            showToast("已从云端恢复个人刷题与打卡进度！", "success");
          }
        } catch (e) {
          showToast("云同步失败：" + e.message, "error");
        } finally {
          setCloudBusy(false);
        }
      };

      // =========================================================================
      // 9. PRACTICE LOGIC (4 MODES + 3 QUESTION TYPES)
      // =========================================================================
      const activeChapter = useMemo(() => curriculum.chapters.find(c => c.id === activeChapterId) || null, [curriculum.chapters, activeChapterId]);
      const activeChapterQuestions = useMemo(() => questions.filter(q => q.chapterId === activeChapterId), [questions, activeChapterId]);

      const startChapterSession = (chapterId, mode, filterType = "all", startQid = null) => {
        const chQs = questions.filter(q => q.chapterId === chapterId);
        let targetQs = chQs;
        if (filterType === "unused") targetQs = chQs.filter(q => !attemptedMap[q.id]);
        else if (filterType === "wrong") targetQs = chQs.filter(q => attemptedMap[q.id] && !attemptedMap[q.id].lastCorrect);
        else if (filterType === "marked") targetQs = chQs.filter(q => markedIds.includes(q.id));

        if (targetQs.length === 0) {
          showToast("当前筛选条件下暂无题目", "info");
          return;
        }
        let startIdx = 0;
        if (startQid) {
          const foundIdx = targetQs.findIndex(q => q.id === startQid);
          if (foundIdx >= 0) startIdx = foundIdx;
        }
        setSession({
          chapterId,
          mode,
          qIds: targetQs.map(q => q.id),
          currentIndex: startIdx,
          choiceAnswers: {},
          blankAnswers: {},
          caseAnswers: {},
          submitted: {},
          elapsedSec: 0,
          testSubmitted: false
        });
        setView("PRACTICE");
      };

      const evaluateQuestion = (q, sess) => {
        if (q.type === "choice") {
          const ans = sess.choiceAnswers[q.id] || "";
          if (!ans) return false;
          const norm = (s) => String(s).toUpperCase().split("").filter(c => /[A-Z]/.test(c)).sort().join("");
          return norm(ans) === norm(q.answer);
        }
        if (q.type === "blank") {
          const userBlanks = sess.blankAnswers[q.id] || [];
          const expected = q.blanks || [];
          if (expected.length === 0) return false;
          return expected.every((exp, i) => checkBlankMatch(userBlanks[i], exp));
        }
        if (q.type === "case") {
          const subs = q.subQuestions || [];
          const uSubs = sess.caseAnswers[q.id] || {};
          if (subs.length === 0) return false;
          let choiceSubs = subs.map((s, idx) => ({ s, idx })).filter(x => x.s.type === "choice");
          if (choiceSubs.length === 0) return true; // Self-graded text case
          return choiceSubs.every(({ s, idx }) => {
            const norm = (str) => String(str || "").toUpperCase().split("").filter(c => /[A-Z]/.test(c)).sort().join("");
            return norm(uSubs[idx]) === norm(s.answer);
          });
        }
        return false;
      };

      const commitQuestionResult = (q, isCorrect) => {
        setAttemptedMap(prev => ({ ...prev, [q.id]: { lastCorrect: isCorrect, count: (prev[q.id]?.count || 0) + 1 } }));
        setLastPosMap(prev => ({ ...prev, [q.chapterId]: q.id }));
        const dk = getStudyDateKey();
        setDailyLogs(prev => {
          const cur = prev[dk] || { studySec: 0, qCount: 0, qCorrect: 0 };
          return {
            ...prev,
            [dk]: {
              ...cur,
              qCount: (cur.qCount || 0) + 1,
              qCorrect: (cur.qCorrect || 0) + (isCorrect ? 1 : 0)
            }
          };
        });
        if (!isCorrect) {
          const nowMs = Date.now();
          setMistakes(prev => {
            const existing = prev.find(m => m.id === q.id);
            const rec = {
              id: q.id,
              wrongCount: existing ? (existing.wrongCount || 1) + 1 : 1,
              lastWrongAt: nowMs,
              fsrs: existing?.fsrs ? fsrsSchedule(existing.fsrs, 1, 0.90, nowMs) : createInitialFSRS(nowMs)
            };
            return [rec, ...prev.filter(m => m.id !== q.id)];
          });
        }
      };

      const submitSingleInSession = (q, overrideChoice = null) => {
        if (!session) return;
        const updatedSess = overrideChoice !== null ? {
          ...session,
          choiceAnswers: { ...session.choiceAnswers, [q.id]: overrideChoice },
          submitted: { ...session.submitted, [q.id]: true }
        } : {
          ...session,
          submitted: { ...session.submitted, [q.id]: true }
        };
        const isCorrect = evaluateQuestion(q, updatedSess);
        setSession(updatedSess);
        if (!session.submitted[q.id]) {
          commitQuestionResult(q, isCorrect);
        }
      };

      const submitEntireTestExam = () => {
        if (!session) return;
        const newSub = { ...session.submitted };
        let correctCnt = 0;
        session.qIds.forEach(qid => {
          const q = questions.find(item => item.id === qid);
          if (!q) return;
          const isCorrect = evaluateQuestion(q, session);
          if (isCorrect) correctCnt++;
          if (!newSub[qid]) {
            commitQuestionResult(q, isCorrect);
            newSub[qid] = true;
          }
        });
        setSession(prev => ({ ...prev, submitted: newSub, testSubmitted: true, testCorrectCount: correctCnt }));
        setView("TEST_RESULT");
      };

      const dueMistakes = useMemo(() => {
        const now = Date.now();
        const validQMap = new Map(questions.map(q => [q.id, q]));
        return mistakes
          .filter(m => validQMap.has(m.id) && (!m.fsrs || (m.fsrs.due || 0) <= now))
          .map(m => ({ ...m, question: validQMap.get(m.id) }));
      }, [mistakes, questions]);

      // =========================================================================
      // 10. ADMIN CURRICULUM & QUESTION CRUD
      // =========================================================================
      const addSemester = () => {
        if (!newSemName.trim()) return;
        setCurriculum(p => ({ ...p, semesters: [...p.semesters, { id: `sem_${Date.now()}`, name: newSemName.trim(), order: p.semesters.length + 1 }] }));
        setNewSemName("");
        showToast("已添加大类（学期），记得点击“发布至全端”同步给同学", "success");
      };
      const addSubject = () => {
        if (!newSubName.trim() || !newSubSemId) return;
        setCurriculum(p => ({ ...p, subjects: [...p.subjects, { id: `sub_${Date.now()}`, semesterId: newSubSemId, name: newSubName.trim(), desc: "课内学科", order: p.subjects.length + 1 }] }));
        setNewSubName("");
        showToast("已添加学科", "success");
      };
      const addChapter = () => {
        if (!newChName.trim() || !newChSubId) return;
        setCurriculum(p => ({ ...p, chapters: [...p.chapters, { id: `ch_${Date.now()}`, subjectId: newChSubId, name: newChName.trim(), order: p.chapters.length + 1 }] }));
        setNewChName("");
        showToast("已添加章节", "success");
      };

      const saveEditedNode = () => {
        if (!editingNode || !editingNode.name.trim()) return;
        if (editingNode.kind === "sem") {
          setCurriculum(p => ({ ...p, semesters: p.semesters.map(s => s.id === editingNode.id ? { ...s, name: editingNode.name.trim() } : s) }));
        } else if (editingNode.kind === "sub") {
          setCurriculum(p => ({ ...p, subjects: p.subjects.map(s => s.id === editingNode.id ? { ...s, name: editingNode.name.trim() } : s) }));
        } else if (editingNode.kind === "ch") {
          setCurriculum(p => ({ ...p, chapters: p.chapters.map(c => c.id === editingNode.id ? { ...c, name: editingNode.name.trim() } : c) }));
        }
        setEditingNode(null);
        showToast("名称已修改", "success");
      };

      const deleteSemester = (semId) => {
        const subIds = new Set(curriculum.subjects.filter(s => s.semesterId === semId).map(s => s.id));
        const chIds = new Set(curriculum.chapters.filter(c => subIds.has(c.subjectId)).map(c => c.id));
        setCurriculum(p => ({
          ...p,
          semesters: p.semesters.filter(s => s.id !== semId),
          subjects: p.subjects.filter(s => s.semesterId !== semId),
          chapters: p.chapters.filter(c => !subIds.has(c.subjectId))
        }));
        setQuestions(p => p.filter(q => !chIds.has(q.chapterId)));
        showToast("已删除该大类及其下属学科、章节和题目", "info");
      };
      const deleteSubject = (subId) => {
        const chIds = new Set(curriculum.chapters.filter(c => c.subjectId === subId).map(c => c.id));
        setCurriculum(p => ({
          ...p,
          subjects: p.subjects.filter(s => s.id !== subId),
          chapters: p.chapters.filter(c => c.subjectId !== subId)
        }));
        setQuestions(p => p.filter(q => !chIds.has(q.chapterId)));
        showToast("已删除该学科及其下属章节和题目", "info");
      };
      const deleteChapter = (chId) => {
        setCurriculum(p => ({ ...p, chapters: p.chapters.filter(c => c.id !== chId) }));
        setQuestions(p => p.filter(q => q.chapterId !== chId));
        showToast("已删除该章节及其题目", "info");
      };

      const handleSaveManualQuestion = () => {
        if (!isAdmin || !qChapterId || !qStem.trim()) { showToast("请选择章节并填写题干", "error"); return; }
        let newQ = { id: `q_${Date.now()}`, chapterId: qChapterId, type: qType, stem: qStem.trim(), image: qImg || undefined, explanation: qExp.trim(), keyPoint: qKeyPoint.trim() };
        if (qType === "choice") {
          const cleanOpts = {};
          Object.entries(qOpts).forEach(([k, v]) => { if (v.trim()) cleanOpts[k] = v.trim(); });
          if (Object.keys(cleanOpts).length < 2) { showToast("请至少填写 2 个选项", "error"); return; }
          newQ = { ...newQ, isMultiple: qIsMultiple, options: cleanOpts, answer: qChoiceAns.trim().toUpperCase() || "A" };
        } else if (qType === "blank") {
          const blanks = qBlanksStr.split("\n").map(s => s.trim()).filter(Boolean);
          if (blanks.length === 0) { showToast("请填写填空答案（每行对应一个空）", "error"); return; }
          newQ = { ...newQ, blanks };
        } else if (qType === "case") {
          const validSubs = qCaseSubs.filter(s => s.stem.trim());
          if (validSubs.length === 0) { showToast("请至少填写 1 个案例子问题", "error"); return; }
          newQ = { ...newQ, subQuestions: validSubs };
        }
        setQuestions(prev => [newQ, ...prev]);
        setQStem(""); setQImg(""); setQOpts({ A: "", B: "", C: "", D: "", E: "" }); setQBlanksStr(""); setQExp(""); setQKeyPoint("");
        showToast("题目已录入本地库！别忘了点“发布至全端”", "success");
      };

      const parseImportJson = (rawText) => {
        try {
          const parsed = JSON.parse((rawText || impJsonText).trim());
          const arr = Array.isArray(parsed) ? parsed : [parsed];
          const valid = arr.filter(q => q && q.stem).map((q, idx) => {
            const type = ["choice", "blank", "case"].includes(q.type) ? q.type : "choice";
            const targetCh = curriculum.chapters.some(c => c.id === q.chapterId) ? q.chapterId : impChapterId;
            return {
              id: q.id || `q_imp_${Date.now()}_${idx}`,
              chapterId: targetCh,
              type,
              isMultiple: Boolean(q.isMultiple || (q.answer && String(q.answer).length > 1 && type === "choice")),
              stem: String(q.stem).trim(),
              image: q.image || q.vignetteImage || undefined,
              options: q.options || undefined,
              answer: q.answer ? String(q.answer).trim().toUpperCase() : undefined,
              blanks: Array.isArray(q.blanks) ? q.blanks : undefined,
              subQuestions: Array.isArray(q.subQuestions) ? q.subQuestions : undefined,
              explanation: q.explanation || q.generalExplanation || "",
              keyPoint: q.keyPoint || q.educationalObjective || ""
            };
          });
          if (valid.length === 0) { showToast("未识别到有效题目", "error"); return; }
          setImpPreview(valid);
        } catch {
          showToast("JSON 格式有误，请检查语法", "error");
        }
      };

      // =========================================================================
      // 11. RENDER
      // =========================================================================
      const formatTime = (sec) => `${String(Math.floor((sec || 0) / 60)).padStart(2, "0")}:${String((sec || 0) % 60).padStart(2, "0")}`;

      const getChapterLabel = (chId) => {
        const ch = curriculum.chapters.find(c => c.id === chId);
        if (!ch) return "未分类章节";
        const sub = curriculum.subjects.find(s => s.id === ch.subjectId);
        const sem = sub ? curriculum.semesters.find(x => x.id === sub.semesterId) : null;
        return `${sem ? sem.name + " · " : ""}${sub ? sub.name + " · " : ""}${ch.name}`;
      };

      return (
        <div className={`min-h-screen flex flex-col ${darkMode && view === "PRACTICE" ? "bg-slate-950 text-slate-100" : "bg-slate-100 text-slate-900"}`}>
          {toast && (
            <div className={`fixed top-14 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl shadow-xl text-xs sm:text-sm font-semibold flex items-center gap-2 border ${
              toast.type === "error" ? "bg-rose-600 text-white border-rose-400" :
              toast.type === "success" ? "bg-emerald-600 text-white border-emerald-400" :
              "bg-slate-800 text-white border-slate-600"
            }`}>
              <Icon name={toast.type === "error" ? "alert" : "sparkles"} className="w-4 h-4 shrink-0" />
              <span>{toast.msg}</span>
            </div>
          )}

          {/* LOGIN / INVITE-CODE REGISTRATION GATE */}
          {currentUser === "guest" ? (
            <div className="flex-1 min-h-screen bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-white text-slate-900 rounded-2xl shadow-2xl p-6 sm:p-8 space-y-5">
                <div className="text-center space-y-2">
                  <div className="w-14 h-14 mx-auto rounded-2xl bg-blue-700 text-white flex items-center justify-center font-black text-2xl shadow-lg">鸭</div>
                  <h1 className="text-xl font-extrabold text-slate-900">鸭考帮 · 课内医学刷题系统</h1>
                  <p className="text-xs text-slate-500">支持全真章节刷题、背题、快刷、测试与云端同步 · 凭邀请码注册</p>
                </div>
                <div className="flex gap-2 text-xs">
                  <button onClick={() => { setAuthMode("login"); setOtpSent(false); }} className={`flex-1 py-2 rounded-lg font-bold ${authMode === "login" ? "bg-blue-700 text-white" : "bg-slate-100 text-slate-600"}`}>登录</button>
                  <button onClick={() => { setAuthMode("register"); setOtpSent(false); }} className={`flex-1 py-2 rounded-lg font-bold ${authMode === "register" ? "bg-emerald-600 text-white" : "bg-slate-100 text-slate-600"}`}>邀请码注册</button>
                  <button onClick={() => { setAuthMode("reset"); setOtpSent(false); }} className={`flex-1 py-2 rounded-lg font-bold ${authMode === "reset" ? "bg-amber-600 text-white" : "bg-slate-100 text-slate-600"}`}>忘记密码</button>
                </div>
                <div className="space-y-3 text-xs">
                  {authMode === "register" && (
                    <div className="relative">
                      <input type="text" value={authInviteCode} onChange={(e) => setAuthInviteCode(e.target.value.toUpperCase())} placeholder="输入专属邀请码（如 YKB-XXXX-XXXX）" className="w-full border-2 border-emerald-300 bg-emerald-50/40 rounded-xl px-3.5 py-2.5 text-sm font-mono font-bold tracking-wider uppercase" />
                    </div>
                  )}
                  <input type="email" value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} placeholder="输入邮箱地址" className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm" />
                  {authMode !== "reset" && <input type="password" value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} placeholder="密码 (至少 6 位)" className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm" />}
                  {(authMode === "register" || authMode === "reset") && (
                    <div className="space-y-2 p-3 rounded-xl bg-slate-50 border border-slate-200">
                      <div className="flex gap-2">
                        <input type="text" value={authOtp} onChange={(e) => setAuthOtp(e.target.value)} placeholder="输入邮箱验证码" className="flex-1 border rounded-lg px-3 py-2 bg-white font-mono" />
                        <button disabled={authBusy || otpCooldown > 0} onClick={() => sendEmailOtp(authMode)} className="px-3 py-2 rounded-lg bg-slate-800 text-white font-bold disabled:opacity-50 shrink-0">
                          {authBusy ? "核验中..." : otpCooldown > 0 ? `${otpCooldown}s` : otpSent ? "重发" : "发送验证码"}
                        </button>
                      </div>
                      {authMode === "reset" && <input type="password" value={newResetPassword} onChange={(e) => setNewResetPassword(e.target.value)} placeholder="设置新密码 (至少 6 位)" className="w-full border rounded-lg px-3 py-2 bg-white" />}
                    </div>
                  )}
                  {authMode === "login" && (
                    <div className="flex items-center justify-between pt-1 text-xs text-slate-600">
                      <label className="flex items-center gap-1.5 cursor-pointer select-none">
                        <input type="checkbox" checked={rememberPwd} onChange={(e) => { const v = e.target.checked; setRememberPwd(v); if (!v) setAutoLogin(false); }} className="accent-blue-700 w-3.5 h-3.5" />
                        <span>记住密码</span>
                      </label>
                      <label className="flex items-center gap-1.5 cursor-pointer select-none">
                        <input type="checkbox" checked={autoLogin} onChange={(e) => { const v = e.target.checked; setAutoLogin(v); if (v) setRememberPwd(true); }} className="accent-blue-700 w-3.5 h-3.5" />
                        <span>自动登录</span>
                      </label>
                    </div>
                  )}
                  <button disabled={authBusy} onClick={handleAuthSubmit} className="w-full py-3 rounded-xl bg-blue-700 hover:bg-blue-600 text-white font-extrabold text-sm shadow-lg">
                    {authBusy ? "处理中..." : authMode === "register" ? "验证邀请码并完成注册" : authMode === "reset" ? "验证并重设密码" : "登录进入鸭考帮"}
                  </button>
                </div>
              </div>
            </div>
          ) : (
            <>
              {/* =============================================================== */}
              {/* VIEW 1: DASHBOARD                                               */}
              {/* =============================================================== */}
              {view === "DASHBOARD" && (
                <>
                  <header className="bg-blue-900 text-white shadow-md px-4 sm:px-6 py-3">
                    <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                      <div className="flex items-center gap-3">
                        <div className="w-9 h-9 rounded-lg bg-blue-600 border border-blue-400 flex items-center justify-center font-black text-base shadow">鸭</div>
                        <div>
                          <h1 className="font-bold text-base sm:text-lg leading-tight">鸭考帮 · 课内医学 QBank</h1>
                          <p className="text-[11px] text-blue-200">学期-学科-章节自由架构 · 四模式刷题 · 每日 03:00 统计与打卡</p>
                        </div>
                      </div>
                      <div className="flex flex-wrap items-center gap-2">
                        <button onClick={() => pullGlobalForced(false)} className="px-3 py-1.5 rounded-lg bg-blue-800 hover:bg-blue-700 border border-blue-600 text-xs font-semibold flex items-center gap-1.5">
                          <Icon name="refresh" className="w-3.5 h-3.5 text-sky-300" />
                          <span>同步最新题库</span>
                        </button>
                        {isAdmin && (
                          <button onClick={() => setShowAdminModal(true)} className="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow flex items-center gap-1.5">
                            <Icon name="settings" className="w-3.5 h-3.5" />
                            <span>管理后台 & 邀请码</span>
                          </button>
                        )}
                        <button onClick={() => setShowAuthModal(true)} className="px-3 py-1.5 rounded-lg bg-blue-800 hover:bg-blue-700 border border-blue-600 text-xs font-semibold flex items-center gap-1.5">
                          <Icon name="user" className="w-4 h-4 text-emerald-300" />
                          <span className="max-w-[120px] truncate">{currentUser}</span>
                        </button>
                      </div>
                    </div>
                  </header>

                  <main className="max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">
                    {syncStatus && (
                      <div className="bg-blue-50 border border-blue-200 text-blue-800 rounded-xl px-4 py-2.5 text-xs font-bold flex items-center gap-2">
                        <Icon name="cloud" className="w-4 h-4 animate-pulse" />
                        <span>{syncStatus}</span>
                      </div>
                    )}

                    {/* TODAY'S STATS + CHECK-IN CALENDAR */}
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
                      <div className="lg:col-span-5 bg-white rounded-2xl border border-slate-200 shadow-sm p-5 flex flex-col justify-between space-y-4">
                        <div className="flex items-center justify-between border-b pb-2.5">
                          <span className="font-bold text-sm text-slate-800">今日学习统计 (03:00 结算)</span>

                        </div>
                        <div className="grid grid-cols-3 gap-2.5 text-center">
                          <div className="p-3 rounded-xl bg-blue-50 border border-blue-100">
                            <div className="text-[11px] text-slate-500">学习时长</div>
                            <div className="text-lg font-extrabold text-blue-700 mt-0.5">{Math.floor(todayStats.studySec / 60)}分</div>
                          </div>
                          <div className="p-3 rounded-xl bg-slate-50 border border-slate-200">
                            <div className="text-[11px] text-slate-500">今日做题</div>
                            <div className="text-lg font-extrabold text-slate-800 mt-0.5">{todayStats.qCount} 题</div>
                          </div>
                          <div className="p-3 rounded-xl bg-emerald-50 border border-emerald-100">
                            <div className="text-[11px] text-slate-500">今日正确率</div>

                          </div>
                        </div>
                        <div>
                          <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                            <div className={`h-full transition-all ${(todayStats.qCount || 0) >= 1 ? "bg-emerald-500" : "bg-amber-500"}`} style={{ width: `${(todayStats.qCount || 0) >= 1 ? 100 : 0}%` }} />
                          </div>
                          <div className="text-[11px] mt-1.5 font-semibold text-slate-500">
                            {(todayStats.qCount || 0) >= 1 ? `🔥 今日已完成 ${todayStats.qCount} 题，日历火苗已点亮！` : "今日完成任意 1 题即可自动点亮日历火苗"}
                          </div>
                        </div>
                      </div>

                      <div className="lg:col-span-7 bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-5">
                        {(() => {
                          const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

                                    }
                                  }} className={`w-full text-left flex items-start gap-3 px-3 py-2.5 rounded-lg border transition ${cls}`}>
                                    <span className={`w-6 h-6 rounded-full border flex items-center justify-center text-xs font-bold shrink-0 ${isSel ? "bg-blue-700 text-white border-blue-700" : ""}`}>{key}</span>
                                    <span className={fontSizeCls}>{text}</span>
                                  </button>
                                );
                              })}
                            </div>
                          )}

                          {/* TYPE 2: FILL-IN-THE-BLANK */}
                          {q.type === "blank" && (
                            <div className="space-y-3 p-4 rounded-xl border-2 border-indigo-200 bg-indigo-50/30">
                              {(q.blanks || []).map((exp, idx) => {
                                const userVal = (session.blankAnswers[q.id] || [])[idx] || "";
                                const matched = isRevealed ? checkBlankMatch(userVal, exp) : null;
                                return (
                                  <div key={idx} className="space-y-1">
                                    <label className="text-xs font-bold text-slate-600">第 {idx + 1} 空：</label>
                                    <input
                                      type="text"
                                      disabled={isRevealed}
                                      value={userVal}
                                      onChange={(e) => {
                                        const arr = [...(session.blankAnswers[q.id] || [])];
                                        arr[idx] = e.target.value;
                                        setSession(p => ({ ...p, blankAnswers: { ...p.blankAnswers, [q.id]: arr } }));
                                      }}
                                      placeholder={`输入第 ${idx + 1} 空答案...`}
                                      className={`w-full border rounded-xl px-3.5 py-2.5 text-sm bg-white text-slate-900 ${isRevealed ? (matched ? "border-emerald-500 bg-emerald-50" : "border-rose-400 bg-rose-50") : "border-slate-300"}`}
                                    />
                                    {isRevealed && <div className="text-xs font-bold text-emerald-700">参考答案：{exp}</div>}
                                  </div>
                                );
                              })}
                            </div>
                          )}

                          {/* TYPE 3: CASE ANALYSIS */}
                          {q.type === "case" && (
                            <div className="space-y-4">
                              {(q.subQuestions || []).map((sub, sIdx) => {
                                const uSubVal = (session.caseAnswers[q.id] || {})[sIdx] || "";
                                return (
                                  <div key={sIdx} className="p-4 rounded-xl border border-slate-200 bg-slate-50/80 text-slate-900 space-y-2.5">
                                    <div className="font-bold text-sm">{sub.stem}</div>
                                    {sub.type === "choice" && sub.options ? (
                                      <div className="space-y-1.5">
                                        {Object.entries(sub.options).map(([ok, ov]) => {
                                          const isSel = uSubVal.includes(ok);
                                          const isRight = String(sub.answer || "").includes(ok);
                                          let cCls = "bg-white border-slate-200";
                                          if (!isRevealed && isSel) cCls = "bg-blue-100 border-blue-500";
                                          if (isRevealed) {
                                            if (isRight) cCls = "bg-emerald-50 border-emerald-500 font-bold";
                                            else if (isSel) cCls = "bg-rose-50 border-rose-500";
                                          }
                                          return (
                                            <button key={ok} disabled={isRevealed} onClick={() => {
                                              const prevMap = session.caseAnswers[q.id] || {};
                                              setSession(p => ({ ...p, caseAnswers: { ...p.caseAnswers, [q.id]: { ...prevMap, [sIdx]: ok } } }));
                                            }} className={`w-full text-left px-3 py-2 rounded-lg border text-xs sm:text-sm flex items-center gap-2 ${cCls}`}>
                                              <span className="font-bold">{ok}.</span><span>{ov}</span>
                                            </button>
                                          );
                                        })}
                                      </div>
                                    ) : (
                                      <textarea
                                        rows={3}
                                        disabled={isRevealed}
                                        value={uSubVal}
                                        onChange={(e) => {
                                          const prevMap = session.caseAnswers[q.id] || {};
                                          setSession(p => ({ ...p, caseAnswers: { ...p.caseAnswers, [q.id]: { ...prevMap, [sIdx]: e.target.value } } }));
                                        }}
                                        placeholder="输入你的临床分析思路与答案..."
                                        className="w-full border rounded-xl p-3 text-xs sm:text-sm bg-white"
                                      />
                                    )}
                                    {isRevealed && (
                                      <div className="p-3 rounded-lg bg-emerald-50/80 border border-emerald-200 text-xs space-y-1">
                                        <div className="font-bold text-emerald-800">参考答案：{sub.answer}</div>
                                        {sub.explanation && <div className="text-slate-700 whitespace-pre-line">{sub.explanation}</div>}
                                      </div>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                          )}

                          {/* Submit button for Practice / Quick (for non-single-choice) */}
                          {!isRevealed && !isTest && (!isQuick || q.isMultiple || q.type !== "choice") && (
                            <button onClick={() => submitSingleInSession(q)} className="px-7 py-2.5 rounded-xl bg-blue-700 hover:bg-blue-600 text-white font-bold text-sm shadow">
                              提交答案
                            </button>
                          )}

                          {/* Answer & Explanation Box */}
                          {isRevealed && (
                            <div className="rounded-xl border border-slate-200 bg-slate-50 text-slate-900 p-5 space-y-3">
                              <div className="flex flex-wrap items-center justify-between gap-2 pb-2 border-b">
                                {!isRecite ? (
                                  <span className={`font-extrabold text-sm ${isCorrect ? "text-emerald-600" : "text-rose-600"}`}>
                                    {isCorrect ? "✓ 回答正确" : `✗ 回答有误${q.type === "choice" ? ` · 正确答案：${q.answer}` : ""}`}
                                  </span>
                                ) : (
                                  <span className="font-extrabold text-sm text-indigo-700">
                                    📖 背题模式 · {q.type === "choice" ? `正确答案：${q.answer}` : "标准答案见上方"}
                                  </span>
                                )}
                              </div>
                              {q.explanation && (
                                <div className="space-y-1">
                                  <div className="text-xs font-extrabold text-blue-700">详细解析</div>
                                  <p className="text-xs sm:text-sm leading-relaxed whitespace-pre-line text-slate-800">{q.explanation}</p>
                                </div>
                              )}
                              {q.keyPoint && (
                                <div className="p-3.5 rounded-xl bg-amber-50 border border-amber-200">
                                  <div className="text-xs font-extrabold text-amber-800 mb-0.5">核心考点 / 记忆点</div>
                                  <p className="text-xs sm:text-sm text-amber-950 whitespace-pre-line">{q.keyPoint}</p>
                                </div>
                              )}
                            </div>
                          )}
                        </div>
                      </main>
                    </div>

                    <footer className="bg-[#1b4b91] text-white px-4 py-2 flex items-center justify-between text-xs shrink-0">
                      <span className="font-mono">{activeChapter?.name || "刷题中"}</span>
                      <div className="flex gap-2">
                        {isTest && !session.testSubmitted ? (
                          <button onClick={submitEntireTestExam} className="px-4 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold shadow">交卷并查看成绩</button>
                        ) : (
                          <button onClick={() => setView("CHAPTER_OVERVIEW")} className="px-3 py-1 rounded bg-blue-800 font-semibold">返回章节总览</button>
                        )}
                      </div>
                    </footer>
                  </div>
                );
              })()}

              {/* =============================================================== */}
              {/* VIEW 4: TEST MODE RESULT SUMMARY                                */}
              {/* =============================================================== */}
              {view === "TEST_RESULT" && session && (
                <div className="flex-1 flex items-center justify-center p-6">
                  <div className="w-full max-w-xl bg-white rounded-2xl border shadow-xl p-8 text-center space-y-5">
                    <div className="text-xs font-bold text-blue-700">测试模式交卷成绩单</div>
                    <h2 className="text-2xl font-extrabold text-slate-900">{activeChapter?.name}</h2>
                    <div className="text-5xl font-black text-blue-700">

                    </div>
                    <p className="text-sm text-slate-600">

                    </p>
                    <div className="flex justify-center gap-3 pt-2">
                      <button onClick={() => { setSession(p => ({ ...p, currentIndex: 0 })); setView("PRACTICE"); }} className="px-5 py-2.5 rounded-xl bg-blue-700 text-white font-bold text-sm">查看全部答案与解析</button>
                      <button onClick={() => setView("CHAPTER_OVERVIEW")} className="px-5 py-2.5 rounded-xl bg-slate-100 text-slate-800 font-bold text-sm">返回章节总览</button>
                    </div>
                  </div>
                </div>
              )}

              {/* =============================================================== */}
              {/* MODAL: ADMIN MANAGER (FLEXIBLE TREE, IMPORT, INVITE CODES)      */}
              {/* =============================================================== */}
              {showAdminModal && isAdmin && (
                <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6">
                  <div className="w-full max-w-5xl bg-white rounded-2xl shadow-2xl flex flex-col max-h-[92vh]">
                    <div className="px-5 py-4 border-b flex flex-wrap justify-between items-center gap-2">
                      <div>
                        <h3 className="font-bold text-lg text-slate-900">鸭考帮 · 管理员控制台</h3>
                        <p className="text-[11px] text-slate-500">增删大类/学科/章节/题目后，点击“发布并强制同步至全端”即可推送给所有同学</p>
                      </div>
                      <div className="flex items-center gap-2">
                        <button disabled={cloudBusy} onClick={publishGlobalForced} className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold shadow">
                          {cloudBusy ? "发布中..." : "🚀 发布并强制同步至全端"}
                        </button>
                        <button onClick={() => setShowAdminModal(false)}><Icon name="x" className="w-5 h-5 text-slate-400" /></button>
                      </div>
                    </div>

                    <div className="px-5 pt-3 border-b flex flex-wrap gap-4 text-xs sm:text-sm font-semibold">

                        ["import", "2. JSON 批量导入"],
                        ["addQ", "3. 手动录入题目"],
                        ["browse", `4. 题库管理 (${questions.length})`],
                        ["invites", "5. 🔑 邀请码管理"]
                      ].map(([t, l]) => (
                        <button key={t} onClick={() => setAdminTab(t)} className={`pb-2.5 border-b-2 ${adminTab === t ? "border-blue-600 text-blue-700" : "border-transparent text-slate-500"}`}>{l}</button>
                      ))}
                    </div>

                    <div className="p-5 overflow-y-auto flex-1 text-xs space-y-5">
                      {/* TAB 1: STRUCTURE */}
                      {adminTab === "structure" && (
                        <div className="space-y-5">
                          {editingNode && (
                            <div className="p-3 rounded-xl bg-amber-50 border border-amber-300 flex flex-wrap items-center gap-2">
                              <span className="font-bold text-amber-900">重命名：</span>
                              <input type="text" value={editingNode.name} onChange={(e) => setEditingNode(p => ({ ...p, name: e.target.value }))} className="flex-1 border rounded-lg px-3 py-1.5 bg-white" />
                              <button onClick={saveEditedNode} className="px-3 py-1.5 rounded-lg bg-amber-600 text-white font-bold">保存</button>
                              <button onClick={() => setEditingNode(null)} className="px-3 py-1.5 rounded-lg bg-white border">取消</button>
                            </div>
                          )}

                          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            {/* Add Semester */}
                            <div className="p-4 rounded-xl bg-slate-50 border space-y-2.5">
                              <div className="font-bold text-slate-800">+ 添加大类（学期）</div>
                              <input type="text" value={newSemName} onChange={(e) => setNewSemName(e.target.value)} placeholder="如：大四上、考研一轮" className="w-full border rounded-lg px-3 py-2 bg-white" />
                              <button onClick={addSemester} className="w-full py-2 rounded-lg bg-blue-700 text-white font-bold">添加大类</button>
                            </div>
                            {/* Add Subject */}
                            <div className="p-4 rounded-xl bg-slate-50 border space-y-2.5">
                              <div className="font-bold text-slate-800">+ 添加学科</div>
                              <select value={newSubSemId} onChange={(e) => setNewSubSemId(e.target.value)} className="w-full border rounded-lg px-3 py-2 bg-white">
                                {curriculum.semesters.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                              </select>
                              <input type="text" value={newSubName} onChange={(e) => setNewSubName(e.target.value)} placeholder="如：寄生虫学、病生" className="w-full border rounded-lg px-3 py-2 bg-white" />
                              <button onClick={addSubject} className="w-full py-2 rounded-lg bg-indigo-700 text-white font-bold">添加学科</button>
                            </div>
                            {/* Add Chapter */}
                            <div className="p-4 rounded-xl bg-slate-50 border space-y-2.5">
                              <div className="font-bold text-slate-800">+ 添加章节</div>
                              <select value={newChSubId} onChange={(e) => setNewChSubId(e.target.value)} className="w-full border rounded-lg px-3 py-2 bg-white">
                                {curriculum.subjects.map(s => {
                                  const sem = curriculum.semesters.find(x => x.id === s.semesterId);
                                  return <option key={s.id} value={s.id}>{sem?.name} · {s.name}</option>;
                                })}
                              </select>
                              <input type="text" value={newChName} onChange={(e) => setNewChName(e.target.value)} placeholder="如：第三章 休克" className="w-full border rounded-lg px-3 py-2 bg-white" />
                              <button onClick={addChapter} className="w-full py-2 rounded-lg bg-emerald-600 text-white font-bold">添加章节</button>
                            </div>
                          </div>

                          {/* Tree View */}
                          <div className="space-y-3">
                            {curriculum.semesters.map(sem => (
                              <div key={sem.id} className="rounded-xl border border-slate-200 overflow-hidden">
                                <div className="bg-slate-100 px-4 py-2.5 flex items-center justify-between font-bold">
                                  <span className="text-sm text-slate-900">📁 {sem.name}</span>
                                  <div className="flex gap-2">
                                    <button onClick={() => setEditingNode({ kind: "sem", id: sem.id, name: sem.name })} className="text-blue-700">重命名</button>
                                    <button onClick={() => deleteSemester(sem.id)} className="text-rose-600">删除大类</button>
                                  </div>
                                </div>
                                <div className="p-3 space-y-2.5">
                                  {curriculum.subjects.filter(s => s.semesterId === sem.id).map(sub => (
                                    <div key={sub.id} className="rounded-lg border p-3 space-y-2">
                                      <div className="flex items-center justify-between font-bold text-indigo-800">
                                        <span>📘 {sub.name}</span>
                                        <div className="flex gap-2 text-[11px]">
                                          <button onClick={() => setEditingNode({ kind: "sub", id: sub.id, name: sub.name })} className="text-blue-700">重命名</button>
                                          <button onClick={() => deleteSubject(sub.id)} className="text-rose-600">删除学科</button>
                                        </div>
                                      </div>
                                      <div className="pl-4 space-y-1">
                                        {curriculum.chapters.filter(c => c.subjectId === sub.id).map(ch => (
                                          <div key={ch.id} className="flex items-center justify-between py-1 border-b last:border-0 text-slate-700">
                                            <span>📄 {ch.name} <span className="text-slate-400">({questions.filter(q => q.chapterId === ch.id).length} 题)</span></span>
                                            <div className="flex gap-2 text-[11px]">
                                              <button onClick={() => setEditingNode({ kind: "ch", id: ch.id, name: ch.name })} className="text-blue-700">重命名</button>
                                              <button onClick={() => deleteChapter(ch.id)} className="text-rose-600">删除</button>
                                            </div>
                                          </div>
                                        ))}
                                      </div>
                                    </div>
                                  ))}
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>

                      {adminTab === "import" && (
                        <div className="space-y-3">
                          <div className="p-3 rounded-xl bg-slate-50 border space-y-2">

                              <select value={impChapterId} onChange={(e) => setImpChapterId(e.target.value)} className="flex-1 border rounded-lg px-3 py-2 bg-white font-semibold">
                                {curriculum.chapters.map(c => <option key={c.id} value={c.id}>{getChapterLabel(c.id)}</option>)}
                              </select>
                              <label className="px-3 py-2 rounded-lg bg-white border border-blue-300 text-blue-700 font-bold cursor-pointer">
                                选择 .json 文件
                                <input type="file" accept=".json" className="hidden" onChange={(e) => { const f = e.target.files?.[0]; if (!f) return; const r = new FileReader(); r.onload = (ev) => parseImportJson(String(ev.target?.result || "")); r.readAsText(f); e.target.value = ""; }} />
                              </label>
                            </div>
                          </div>
                          {impPreview ? (
                            <div className="p-4 rounded-xl border-2 border-blue-400 bg-blue-50/50 space-y-3">
                              <div className="flex justify-between font-bold text-blue-800">
                                <span>预览待导入：{impPreview.length} 道题</span>
                                <button onClick={() => setImpPreview(null)} className="text-slate-500">取消</button>
                              </div>
                              <div className="max-h-52 overflow-y-auto space-y-1.5">
                                {impPreview.slice(0, 10).map((q, i) => (
                                  <div key={i} className="p-2 rounded bg-white border">
                                    <span className="font-bold text-blue-700">[{q.type}]</span> {q.stem.slice(0, 80)}...
                                  </div>
                                ))}
                              </div>
                              <button onClick={() => { setQuestions(p => [...impPreview, ...p]); setImpPreview(null); setImpJsonText(""); showToast(`已导入 ${impPreview.length} 题！`, "success"); setAdminTab("browse"); }} className="px-5 py-2 rounded-lg bg-blue-700 text-white font-bold">确认导入</button>
                            </div>
                          ) : (
                            <>
                              <textarea rows={7} value={impJsonText} onChange={(e) => setImpJsonText(e.target.value)} className="w-full border rounded-xl p-3 font-mono" placeholder='粘贴 JSON 数组，如：[{"type":"choice","stem":"...","options":{"A":"...","B":"..."},"answer":"A","explanation":"..."}]' />
                              <button onClick={() => parseImportJson()} className="px-5 py-2.5 rounded-xl bg-blue-700 text-white font-bold">解析并预览</button>
                            </>
                          )}
                        </div>
                      )}

                      {/* TAB 3: MANUAL ADD QUESTION */}
                      {adminTab === "addQ" && (
                        <div className="space-y-3">
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            <select value={qChapterId} onChange={(e) => setQChapterId(e.target.value)} className="border rounded-lg px-3 py-2 bg-white font-semibold">
                              {curriculum.chapters.map(c => <option key={c.id} value={c.id}>{getChapterLabel(c.id)}</option>)}
                            </select>
                            <div className="flex gap-1.5">
                              {[["choice", "选择题"], ["blank", "填空题"], ["case", "案例分析题"]].map(([t, l]) => (
                                <button key={t} onClick={() => setQType(t)} className={`flex-1 py-2 rounded-lg font-bold border ${qType === t ? "bg-blue-700 text-white border-blue-700" : "bg-slate-50"}`}>{l}</button>
                              ))}
                            </div>
                          </div>
                          <textarea rows={3} value={qStem} onChange={(e) => setQStem(e.target.value)} placeholder="输入题干（案例分析题在此输入病例资料）..." className="w-full border rounded-xl p-3" />

                          {qType === "choice" && (
                            <div className="space-y-2.5 p-3 rounded-xl bg-slate-50 border">
                              <label className="flex items-center gap-2 font-bold"><input type="checkbox" checked={qIsMultiple} onChange={(e) => setQIsMultiple(e.target.checked)} /> <span>多选题</span></label>
                              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                {["A", "B", "C", "D", "E"].map(k => <input key={k} type="text" value={qOpts[k]} onChange={(e) => setQOpts(p => ({ ...p, [k]: e.target.value }))} placeholder={`选项 ${k}`} className="border rounded-lg px-2.5 py-1.5 bg-white" />)}
                              </div>
                              <input type="text" value={qChoiceAns} onChange={(e) => setQChoiceAns(e.target.value)} placeholder="正确答案（单选填 A，多选填 ABC）" className="w-full border rounded-lg px-3 py-2 bg-white font-bold" />
                            </div>
                          )}

                          {qType === "blank" && (
                            <textarea rows={3} value={qBlanksStr} onChange={(e) => setQBlanksStr(e.target.value)} placeholder="每行填一个空的答案（同义答案可用 / 分隔，如：代偿期/早期）" className="w-full border rounded-xl p-3" />
                          )}

                          {qType === "case" && (
                            <div className="space-y-3 p-3 rounded-xl bg-slate-50 border">
                              <div className="flex justify-between items-center font-bold">
                                <span>案例子问题列表：</span>
                                <button onClick={() => setQCaseSubs(p => [...p, { type: "text", stem: "", options: { A: "", B: "", C: "", D: "" }, answer: "", explanation: "" }])} className="px-2.5 py-1 rounded bg-blue-700 text-white">+ 添加子问题</button>

                                  <div className="flex justify-between">
