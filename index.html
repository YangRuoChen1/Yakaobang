                        <div className="flex flex-wrap items-center justify-between gap-2">
                          <span className="font-bold text-sm text-slate-800">章节题号总览 & 关键词搜题：</span>
                          <div className="flex items-center gap-2 border rounded-xl px-3 py-1.5 bg-slate-50 w-full sm:w-72">
                            <Icon name="search" className="w-3.5 h-3.5 text-slate-400" />
                            <input type="text" value={chapterSearchQuery} onChange={(e) => setChapterSearchQuery(e.target.value)} placeholder="本章关键词搜题..." className="text-xs bg-transparent outline-none flex-1" />
                            {chapterSearchQuery && <button onClick={() => setChapterSearchQuery("")} className="text-[11px] text-slate-400">清空</button>}
                          </div>
                        </div>
                        {kw ? (
                          <div className="space-y-1.5 text-xs">
                            {matchedIndices.length === 0 ? <div className="text-center py-6 text-slate-400">本章无匹配题目</div> : matchedIndices.map(({ q, idx }) => (
                              <div key={q.id} onClick={() => startChapterSession(activeChapter.id, selectedPracticeMode, "all", q.id)} className="p-2.5 rounded-xl border hover:border-blue-400 cursor-pointer flex justify-between items-center gap-2">
                                <span className="truncate"><strong className="text-blue-700">#{idx + 1}</strong> {q.stem}</span>
                                <span className="text-blue-700 font-bold shrink-0">开始 →</span>
                              </div>
                            ))}
                          </div>
                        ) : (
                          <div className="grid grid-cols-6 sm:grid-cols-10 md:grid-cols-12 gap-2">
                            {chQs.map((q, idx) => {
                              const att = attemptedMap[q.id];
                              const isM = markedIds.includes(q.id);
                              let cls = "bg-slate-50 border-slate-200 text-slate-700 hover:border-blue-400";
                              if (att) cls = att.lastCorrect ? "bg-emerald-50 border-emerald-400 text-emerald-800" : "bg-rose-50 border-rose-400 text-rose-800";
                              return (
                                <button key={q.id} onClick={() => startChapterSession(activeChapter.id, selectedPracticeMode, "all", q.id)} className={`relative py-2 rounded-lg border text-xs font-bold transition ${cls}`}>
                                  {idx + 1}{isM && <span className="absolute top-0.5 right-0.5 w-1.5 h-1.5 rounded-full bg-amber-500" />}
                                </button>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    </main>
                  </div>
                );
              })()}

              {/* VIEW 3: PRACTICE / QUICK / RECITE / TEST */}
              {view === "PRACTICE" && session && (() => {
                const curQid = session.qIds[session.currentIndex];
                const q = questions.find(item => item.id === curQid);
                if (!q) return null;
                const isRecite = session.mode === "recite", isTest = session.mode === "test", isQuick = session.mode === "quick";
                const isRevealed = isRecite || (isTest ? session.testSubmitted : Boolean(session.submitted[q.id]));
                const isMarked = markedIds.includes(q.id);
                const fontSizeCls = textSize === 0 ? "text-sm" : textSize === 2 ? "text-lg" : "text-base";
                const modeLabel = { practice: "练习模式", quick: "快刷模式", recite: "背题模式", test: "测试模式" }[session.mode];
                const typeLabel = q.type === "choice" ? (q.isMultiple ? "多选题" : "单选题") : q.type === "blank" ? "填空题" : "案例分析题";
                const isCorrect = isRevealed ? evaluateQuestion(q, session) : null;

                return (
                  <div className="flex-1 flex flex-col h-screen overflow-hidden">
                    <header className="bg-[#1b4b91] text-white px-3 sm:px-5 py-2.5 flex items-center justify-between gap-2 shrink-0 shadow">
                      <div className="flex items-center gap-2.5">
                        <button onClick={() => setView("CHAPTER_OVERVIEW")} className="px-2.5 py-1 rounded bg-blue-800 hover:bg-blue-700 text-xs font-bold">总览</button>
                        <div className="text-xs sm:text-sm font-bold leading-tight">
                          <div>第 {session.currentIndex + 1} / {session.qIds.length} 题 · <span className="text-amber-300">{modeLabel}</span></div>
                          <div className="text-[10px] text-blue-200 font-mono flex items-center gap-2">
                            <span>{formatTime(session.elapsedSec)}</span>
                            {isIdlePaused && <span className="px-1.5 py-0.2 rounded bg-amber-500 text-slate-950 font-bold">⏸ 挂机已暂停计时</span>}
                          </div>
                        </div>
                        <button onClick={() => { setMarkedIds(p => p.includes(q.id) ? p.filter(i => i !== q.id) : [...p, q.id]); markProgDirty(); }} className={`px-2 py-1 rounded border text-xs font-semibold flex items-center gap-1 ${isMarked ? "bg-rose-600 border-rose-400" : "bg-blue-800/70 border-blue-500"}`}>
                          <Icon name="flag" className="w-3.5 h-3.5" />
                        </button>
                      </div>
                      <div className="flex items-center gap-1.5">
                        <button disabled={session.currentIndex === 0} onClick={() => setSession(p => ({ ...p, currentIndex: p.currentIndex - 1 }))} className="px-2.5 py-1 rounded bg-blue-800 disabled:opacity-40 text-xs font-semibold">上一题</button>
                        <button disabled={session.currentIndex >= session.qIds.length - 1} onClick={() => setSession(p => ({ ...p, currentIndex: p.currentIndex + 1 }))} className="px-2.5 py-1 rounded bg-blue-800 disabled:opacity-40 text-xs font-semibold">下一题</button>
                      </div>
                      <div className="flex items-center gap-1 text-xs">
                        <button onClick={() => setHighlightMode(!highlightMode)} className={`px-2 py-1 rounded ${highlightMode ? "bg-yellow-400 text-slate-950 font-bold" : "hover:bg-blue-800"}`}>荧光笔</button>
                        <button onClick={() => { setNoteTab("edit"); setShowNotesModal(true); }} className="px-2 py-1 rounded bg-amber-500/90 text-slate-950 font-bold">📓 笔记</button>
                        <button onClick={() => setDarkMode(!darkMode)} className="px-2 py-1 rounded hover:bg-blue-800"><Icon name={darkMode ? "sun" : "moon"} className="w-4 h-4" /></button>
                        <button onClick={() => setTextSize(s => (s + 1) % 3)} className="px-2 py-1 rounded hover:bg-blue-800 font-bold">A</button>
                      </div>
                    </header>

                    <div className="flex-1 flex overflow-hidden">
                      <aside className={`w-12 shrink-0 overflow-y-auto border-r flex flex-col items-center py-2 gap-1 ${darkMode ? "bg-slate-900 border-slate-800" : "bg-slate-200 border-slate-300"}`}>
                        {session.qIds.map((id, idx) => {
                          const sub = session.submitted[id];
                          let btnCls = idx === session.currentIndex ? "bg-blue-700 text-white" : "";
                          if (sub && !isTest) {
                            const qq = questions.find(item => item.id === id);
                            btnCls = idx === session.currentIndex ? "bg-blue-700 text-white" : (qq && evaluateQuestion(qq, session)) ? "bg-emerald-100 text-emerald-800" : "bg-rose-100 text-rose-800";
                          }
                          return <button key={id} onClick={() => setSession(p => ({ ...p, currentIndex: idx }))} className={`w-9 h-8 rounded text-xs font-bold ${btnCls}`}>{idx + 1}</button>;
                        })}
                      </aside>

                      <main className={`flex-1 overflow-y-auto p-4 sm:p-8 ${darkMode ? "bg-slate-950 text-slate-100" : "bg-white text-slate-900"}`}>
                        <div className="max-w-4xl mx-auto space-y-6 pb-16">
                          <div className="flex justify-between items-center text-xs">
                            <span className="px-2.5 py-1 rounded-full bg-blue-100 text-blue-800 font-bold">{typeLabel}</span>
                            <button onClick={() => {
                              const sel = window.getSelection()?.toString().trim();
                              if (sel && sel.length >= 2) { setHighlightsMap(p => ({ ...p, [q.id]: [...(p[q.id] || []), sel] })); markProgDirty(); }
                            }} className="px-2 py-0.5 rounded bg-yellow-100 text-yellow-900 border border-yellow-300">高亮选中</button>
                          </div>

                          <p onMouseUp={() => { if (!highlightMode) return; const sel = window.getSelection()?.toString().trim(); if (sel && sel.length >= 2) { setHighlightsMap(p => ({ ...p, [q.id]: [...(p[q.id] || []), sel] })); markProgDirty(); } }} className={`leading-relaxed whitespace-pre-line font-medium ${fontSizeCls}`}>
                            {renderHighlightedText(q.stem, highlightsMap[q.id] || [])}
                          </p>
                          {q.image && <img src={q.image} alt="" onClick={() => setZoomImage(q.image)} className="max-h-72 rounded-lg border mx-auto cursor-zoom-in" />}

                          {q.type === "choice" && q.options && (
                            <div className={`rounded-xl border-2 p-3 sm:p-4 space-y-2 ${darkMode ? "border-slate-700 bg-slate-900/60" : "border-sky-200 bg-slate-50/70"}`}>
                              {Object.entries(q.options).map(([key, text]) => {
                                const curAns = session.choiceAnswers[q.id] || "";
                                const isSel = curAns.includes(key), isRightOpt = String(q.answer || "").includes(key);
                                let cls = "border-transparent hover:bg-blue-50/60";
                                if (!isRevealed && isSel) cls = "bg-blue-100 border-blue-500 text-slate-900";
                                if (isRevealed) { if (isRightOpt) cls = "bg-emerald-50 border-emerald-500 text-slate-900 font-semibold"; else if (isSel) cls = "bg-rose-50 border-rose-500 text-slate-900"; }
                                return (
                                  <button key={key} disabled={isRevealed} onClick={() => {
                                    if (q.isMultiple) {
                                      const nextSet = isSel ? curAns.replace(key, "") : (curAns + key).split("").sort().join("");
                                      setSession(p => ({ ...p, choiceAnswers: { ...p.choiceAnswers, [q.id]: nextSet } }));
                                    } else {
                                      if (isQuick) submitSingleInSession(q, key);
                                      else setSession(p => ({ ...p, choiceAnswers: { ...p.choiceAnswers, [q.id]: key } }));
                                    }
                                  }} className={`w-full text-left flex items-start gap-3 px-3 py-2.5 rounded-lg border transition ${cls}`}>
                                    <span className={`w-6 h-6 rounded-full border flex items-center justify-center text-xs font-bold shrink-0 ${isSel ? "bg-blue-700 text-white border-blue-700" : ""}`}>{key}</span>
                                    <span className={fontSizeCls}>{text}</span>
                                  </button>
                                );
                              })}
                            </div>
                          )}

                          {q.type === "blank" && (
                            <div className="space-y-3 p-4 rounded-xl border-2 border-indigo-200 bg-indigo-50/30">
                              {(q.blanks || []).map((exp, idx) => {
                                const userVal = (session.blankAnswers[q.id] || [])[idx] || "";
                                const matched = isRevealed ? checkBlankMatch(userVal, exp) : null;
                                return (
                                  <div key={idx} className="space-y-1">
                                    <label className="text-xs font-bold text-slate-600">第 {idx + 1} 空：</label>
                                    <input type="text" disabled={isRevealed} value={userVal} onChange={(e) => { const arr = [...(session.blankAnswers[q.id] || [])]; arr[idx] = e.target.value; setSession(p => ({ ...p, blankAnswers: { ...p.blankAnswers, [q.id]: arr } })); }} placeholder={`输入第 ${idx + 1} 空答案...`} className={`w-full border rounded-xl px-3.5 py-2.5 text-sm bg-white text-slate-900 ${isRevealed ? (matched ? "border-emerald-500 bg-emerald-50" : "border-rose-400 bg-rose-50") : "border-slate-300"}`} />
                                    {isRevealed && <div className="text-xs font-bold text-emerald-700">参考答案：{exp}</div>}
                                  </div>
                                );
                              })}
                            </div>
                          )}

                          {q.type === "case" && (
                            <div className="space-y-4">
                              {(q.subQuestions || []).map((sub, sIdx) => {
                                const uSubVal = (session.caseAnswers[q.id] || {})[sIdx] || "";
                                return (
                                  <div key={sIdx} className="p-4 rounded-xl border border-slate-200 bg-slate-50/80 text-slate-900 space-y-2.5">
                                    <div className="font-bold text-sm">{sub.stem}</div>
                                    {sub.type === "choice" && sub.options ? (
                                      <div className="space-y-1.5">
                                        {Object.entries(sub.options).map(([ok, ov]) => {
                                          const isSel = uSubVal.includes(ok), isRight = String(sub.answer || "").includes(ok);
                                          let cCls = "bg-white border-slate-200";
                                          if (!isRevealed && isSel) cCls = "bg-blue-100 border-blue-500";
                                          if (isRevealed) { if (isRight) cCls = "bg-emerald-50 border-emerald-500 font-bold"; else if (isSel) cCls = "bg-rose-50 border-rose-500"; }
                                          return <button key={ok} disabled={isRevealed} onClick={() => { const prevMap = session.caseAnswers[q.id] || {}; setSession(p => ({ ...p, caseAnswers: { ...p.caseAnswers, [q.id]: { ...prevMap, [sIdx]: ok } } })); }} className={`w-full text-left px-3 py-2 rounded-lg border text-xs sm:text-sm flex items-center gap-2 ${cCls}`}><span className="font-bold">{ok}.</span><span>{ov}</span></button>;
                                        })}
                                      </div>
                                    ) : <textarea rows={3} disabled={isRevealed} value={uSubVal} onChange={(e) => { const prevMap = session.caseAnswers[q.id] || {}; setSession(p => ({ ...p, caseAnswers: { ...p.caseAnswers, [q.id]: { ...prevMap, [sIdx]: e.target.value } } })); }} placeholder="输入你的临床分析思路..." className="w-full border rounded-xl p-3 text-xs sm:text-sm bg-white" />}
                                    {isRevealed && <div className="p-3 rounded-lg bg-emerald-50/80 border border-emerald-200 text-xs space-y-1"><div className="font-bold text-emerald-800">参考答案：{sub.answer}</div>{sub.explanation && <div className="text-slate-700 whitespace-pre-line">{sub.explanation}</div>}</div>}
                                  </div>
                                );
                              })}
                            </div>
                          )}

                          {!isRevealed && !isTest && (!isQuick || q.isMultiple || q.type !== "choice") && (
                            <button onClick={() => submitSingleInSession(q)} className="px-7 py-2.5 rounded-xl bg-blue-700 hover:bg-blue-600 text-white font-bold text-sm shadow">提交答案</button>
                          )}

                          {isRevealed && (
                            <div className="rounded-xl border border-slate-200 bg-slate-50 text-slate-900 p-5 space-y-3">
                              <div className="flex justify-between items-center pb-2 border-b">
                                {!isRecite ? <span className={`font-extrabold text-sm ${isCorrect ? "text-emerald-600" : "text-rose-600"}`}>{isCorrect ? "✓ 回答正确" : `✗ 回答有误${q.type === "choice" ? ` · 正确答案：${q.answer}` : ""}`}</span> : <span className="font-extrabold text-sm text-indigo-700">📖 背题模式 · {q.type === "choice" ? `正确答案：${q.answer}` : "标准答案见上方"}</span>}
                              </div>
                              {q.explanation && <div className="space-y-1"><div className="text-xs font-extrabold text-blue-700">详细解析</div><p className="text-xs sm:text-sm leading-relaxed whitespace-pre-line text-slate-800">{q.explanation}</p></div>}
                              {q.keyPoint && <div className="p-3.5 rounded-xl bg-amber-50 border border-amber-200"><div className="text-xs font-extrabold text-amber-800 mb-0.5">核心考点</div><p className="text-xs sm:text-sm text-amber-950 whitespace-pre-line">{q.keyPoint}</p></div>}
                            </div>
                          )}
                        </div>
                      </main>
                    </div>

                    <footer className="bg-[#1b4b91] text-white px-4 py-2 flex items-center justify-between text-xs shrink-0">
                      <span className="font-mono">{activeChapter?.name || "刷题中"}</span>
                      <div className="flex gap-2">
                        {isTest && !session.testSubmitted ? <button onClick={submitEntireTestExam} className="px-4 py-1.5 rounded-lg bg-emerald-500 text-slate-950 font-extrabold shadow">交卷并查看成绩</button> : <button onClick={() => setView("CHAPTER_OVERVIEW")} className="px-3 py-1 rounded bg-blue-800 font-semibold">返回章节总览</button>}
                      </div>
                    </footer>
                  </div>
                );
              })()}

              {/* VIEW 4: TEST RESULT */}
              {view === "TEST_RESULT" && session && (
                <div className="flex-1 flex items-center justify-center p-6">
                  <div className="w-full max-w-xl bg-white rounded-2xl border shadow-xl p-8 text-center space-y-5">
                    <div className="text-xs font-bold text-blue-700">测试模式交卷成绩单</div>
                    <h2 className="text-2xl font-extrabold text-slate-900">{activeChapter?.name}</h2>
                    <div className="text-5xl font-black text-blue-700">{Math.round(((session.testCorrectCount || 0) / Math.max(1, session.qIds.length)) * 100)}%</div>
                    <p className="text-sm text-slate-600">答对 <strong>{session.testCorrectCount || 0}</strong> / {session.qIds.length} 题 · 用时 {formatTime(session.elapsedSec)}</p>
                    <div className="flex justify-center gap-3 pt-2">
                      <button onClick={() => { setSession(p => ({ ...p, currentIndex: 0 })); setView("PRACTICE"); }} className="px-5 py-2.5 rounded-xl bg-blue-700 text-white font-bold text-sm">查看全部答案与解析</button>
                      <button onClick={() => setView("CHAPTER_OVERVIEW")} className="px-5 py-2.5 rounded-xl bg-slate-100 text-slate-800 font-bold text-sm">返回章节总览</button>
                    </div>
                  </div>
                </div>
              )}

              {/* VIEW 5: MY NOTEBOOK (UWORLD-STYLE PERSONAL NOTEBOOK WITH MARKDOWN + LATEX + IMAGES) */}
              {view === "MY_NOTEBOOK" && (() => {
                const allNoteEntries = Object.keys(notesMap).map(qid => {
                  const n = normalizeNote(notesMap[qid]);
                  const q = questions.find(item => item.id === qid);
                  return { qid, note: n, question: q, label: q ? getChapterLabel(q.chapterId) : "已归档题目" };
                }).filter(e => (e.note.text || e.note.images.length > 0));
                const kw = nbSearch.trim().toLowerCase();
                const filteredNotes = allNoteEntries.filter(e => !kw || e.note.text.toLowerCase().includes(kw) || (e.question?.stem || "").toLowerCase().includes(kw) || e.label.toLowerCase().includes(kw));
                const activeEntry = filteredNotes.find(e => e.qid === nbSelectedQid) || filteredNotes[0] || null;

                return (
                  <div className="flex-1 flex flex-col h-screen overflow-hidden">
                    <header className="bg-blue-900 text-white px-4 sm:px-6 py-3 flex items-center justify-between shadow shrink-0">
                      <div className="flex items-center gap-3">
                        <button onClick={() => setView("DASHBOARD")} className="flex items-center gap-1 text-xs sm:text-sm font-bold hover:text-blue-200"><Icon name="chevronLeft" className="w-4 h-4" /> 返回主页</button>
                        <h2 className="font-extrabold text-sm sm:text-base">📓 My Notebook · 个人笔记汇总本 ({allNoteEntries.length})</h2>
                      </div>
                      <button onClick={() => {
                        const md = allNoteEntries.map(e => `## ${e.label}\n> 题干：${e.question?.stem || ""}\n\n${e.note.text}\n`).join("\n---\n\n");
                        const blob = new Blob([md], { type: "text/markdown" });
                        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `YaKaoBang_Notebook_${todayKey}.md`; a.click();
                      }} className="px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 text-xs font-bold">导出 Markdown</button>
                    </header>

                    <div className="flex-1 grid grid-cols-1 md:grid-cols-12 overflow-hidden">
                      <aside className="md:col-span-4 border-r bg-white flex flex-col overflow-hidden">
                        <div className="p-3 border-b">
                          <input type="text" value={nbSearch} onChange={(e) => setNbSearch(e.target.value)} placeholder="搜索笔记内容、章节或题干..." className="w-full border rounded-xl px-3 py-2 text-xs bg-slate-50" />
                        </div>
                        <div className="flex-1 overflow-y-auto divide-y">
                          {filteredNotes.length === 0 ? <div className="p-8 text-center text-xs text-slate-400">暂无笔记，做题时点击右上角「📓 笔记」即可记录</div> : filteredNotes.map(e => (
                            <button key={e.qid} onClick={() => { setNbSelectedQid(e.qid); setNbEditing(false); }} className={`w-full text-left p-3.5 hover:bg-blue-50/50 transition ${activeEntry?.qid === e.qid ? "bg-blue-50 border-l-4 border-blue-700" : ""}`}>
                              <div className="text-[11px] font-bold text-blue-700 truncate">{e.label}</div>
                              <div className="text-xs font-semibold text-slate-800 line-clamp-1 mt-0.5">{e.question?.stem || "独立笔记"}</div>
                              <div className="text-[11px] text-slate-400 line-clamp-1 mt-0.5">{e.note.text || `[含 ${e.note.images.length} 张图片]`}</div>
                            </button>
                          ))}
                        </div>
                      </aside>

                      <main className="md:col-span-8 bg-slate-50 overflow-y-auto p-4 sm:p-8">
                        {!activeEntry ? (
                          <div className="h-full flex items-center justify-center text-sm text-slate-400">选择左侧笔记查看或编辑</div>

                          <div className="max-w-3xl mx-auto bg-white rounded-2xl border shadow-sm p-6 space-y-5">
                            <div className="flex flex-wrap justify-between items-center gap-2 border-b pb-3">
                              <div>
                                <div className="text-xs font-bold text-blue-700">{activeEntry.label}</div>
                                <div className="text-[11px] text-slate-400">更新于：{activeEntry.note.updatedAt ? new Date(activeEntry.note.updatedAt).toLocaleString("zh-CN") : "刚刚"}</div>
                              </div>
                              <div className="flex gap-2 text-xs">
                                {activeEntry.question && <button onClick={() => { setActiveChapterId(activeEntry.question.chapterId); startChapterSession(activeEntry.question.chapterId, "practice", "all", activeEntry.qid); }} className="px-3 py-1.5 rounded-lg bg-blue-50 text-blue-700 font-bold">回看原题</button>}
                                <button onClick={() => setNbEditing(!nbEditing)} className="px-3 py-1.5 rounded-lg bg-blue-700 text-white font-bold">{nbEditing ? "完成编辑" : "编辑笔记"}</button>
                              </div>
                            </div>
                            {activeEntry.question && (
                              <div className="p-3 rounded-xl bg-slate-50 border text-xs text-slate-600 line-clamp-3">{activeEntry.question.stem}</div>
                            )}
                            {nbEditing ? (
                              <div className="space-y-3">
                                <textarea rows={10} value={activeEntry.note.text} onChange={(e) => updateQuestionNote(activeEntry.qid, { text: e.target.value })} placeholder="支持 Markdown 与 LaTeX（如 $E=mc^2$ 或 $$\Delta pH$$）..." className="w-full border rounded-xl p-3 text-sm font-mono" />
                                <label className="inline-block px-3 py-1.5 rounded-lg bg-indigo-50 text-indigo-700 font-bold text-xs cursor-pointer">+ 添加图片<input type="file" accept="image/*" className="hidden" onChange={(e) => { handleAttachNoteImage(activeEntry.qid, e.target.files?.[0]); e.target.value = ""; }} /></label>
                              </div>
                            ) : (
                              <MarkdownLatex text={activeEntry.note.text} />
                            )}
                            {activeEntry.note.images.length > 0 && (
                              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                                {activeEntry.note.images.map((src, i) => (

                    <main className="max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-5">

                        <div className="flex flex-wrap items-center justify-between gap-3">
                          <div className="flex items-center gap-2 border rounded-xl px-3 py-2 bg-slate-50 flex-1 min-w-[220px]">
                            <Icon name="search" className="w-4 h-4 text-slate-400" />
                            <input type="text" value={slideSearch} onChange={(e) => setSlideSearch(e.target.value)} placeholder="搜索切片名称、特征、易混淆点..." className="w-full text-xs sm:text-sm bg-transparent outline-none" />

                          </div>

                            openSlide(shuffled, 0, "random");

                          </button>
                        </div>
                        <div className="flex flex-wrap gap-1.5 text-xs">
                          {cats.map(c => (
                            <button key={c} onClick={() => setSlideCatFilter(c)} className={`px-3 py-1 rounded-full font-bold border ${slideCatFilter === c ? "bg-blue-700 text-white border-blue-700" : "bg-slate-50 text-slate-600"}`}>

                              <div className="aspect-[4/3] bg-slate-900 flex items-center justify-center overflow-hidden">
                                <img src={sl.image} alt={sl.name} className="w-full h-full object-contain" />
                              </div>
                              <div className="p-3 space-y-1 flex-1 flex flex-col justify-between">
                                <div className="font-bold text-xs sm:text-sm text-slate-900 line-clamp-2">{sl.name}</div>
                                <div className="flex items-center justify-between text-[10px] text-slate-400">
                                  <span className="px-1.5 py-0.5 rounded bg-blue-50 text-blue-700 font-semibold">{sl.category || "切片"}</span>
                                  {Array.isArray(sl.annotations) && sl.annotations.length > 0 && <span>🎯 {sl.annotations.length}标注</span>}
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </main>
                  </div>
                );
              })()}

              {/* VIEW 7: SLIDE DETAIL (NORMAL & RANDOM BLIND FLASHCARD WITH ZOOM/PAN + FOCUS RED BOX) */}
              {view === "SLIDE_DETAIL" && (() => {
                const slId = slideQueue[slideIdx];
                const sl = slides.find(x => x.id === slId);
                if (!sl) return null;
                const isBlindFront = slideMode === "random" && !slideRevealed;

                const focusAnnotation = (ann) => {
                  setActiveAnnId(ann.id);
                  setShowAllAnns(true);
                  const targetScale = Math.min(3.4, Math.max(1.8, 65 / Math.max(ann.w || 20, ann.h || 20)));
                  setSlideZoom(Number(targetScale.toFixed(2)));
                  const imgEl = slideImgRef.current;
                  if (imgEl) {
                    const w = imgEl.clientWidth || 600;
                    const h = imgEl.clientHeight || 400;
                    const cx = ((ann.x + ann.w / 2) / 100 - 0.5) * w;
                    const cy = ((ann.y + ann.h / 2) / 100 - 0.5) * h;
                    setSlidePan({ x: -cx * targetScale, y: -cy * targetScale });
                  }
                };

                const resetView = () => {
                  setSlideZoom(1);
                  setSlidePan({ x: 0, y: 0 });
                  setActiveAnnId(null);
                };

                const goSlide = (nextIdx) => {
                  setSlideIdx(nextIdx);
                  setSlideRevealed(slideMode === "normal");
                  resetView();
                };

                const activeAnn = (sl.annotations || []).find(a => a.id === activeAnnId) || null;

                  <div className="flex-1 flex flex-col h-screen overflow-hidden bg-slate-900 text-white">

                          <span>第 {slideIdx + 1} / {slideQueue.length} 张</span>

                        </div>
                      </div>
                      <div className="flex items-center gap-1.5 text-xs">
                        <button onClick={() => setSlideZoom(z => Math.max(0.5, Number((z - 0.3).toFixed(2))))} className="px-2.5 py-1 rounded bg-slate-800 font-bold">缩小 -</button>

                        <button onClick={() => setSlideZoom(z => Math.min(5, Number((z + 0.3).toFixed(2))))} className="px-2.5 py-1 rounded bg-slate-800 font-bold">放大 +</button>

                          e.preventDefault();
                          const delta = e.deltaY < 0 ? 0.2 : -0.2;
                          setSlideZoom(z => Math.min(5, Math.max(0.5, Number((z + delta).toFixed(2)))));
                        }}
                        onMouseDown={(e) => {
                          setSlideDragging(true);
                          slideDragStartRef.current = { x: e.clientX, y: e.clientY, panX: slidePan.x, panY: slidePan.y };
                        }}
                        onMouseMove={(e) => {
                          if (!slideDragging) return;
                          setSlidePan({ x: slideDragStartRef.current.panX + (e.clientX - slideDragStartRef.current.x), y: slideDragStartRef.current.panY + (e.clientY - slideDragStartRef.current.y) });
                        }}
                        onMouseUp={() => setSlideDragging(false)}
                        onMouseLeave={() => setSlideDragging(false)}
                        onTouchStart={(e) => {
                          if (e.touches.length !== 1) return;
                          setSlideDragging(true);
                          slideDragStartRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY, panX: slidePan.x, panY: slidePan.y };
                        }}
                        onTouchMove={(e) => {
                          if (!slideDragging || e.touches.length !== 1) return;
                          setSlidePan({ x: slideDragStartRef.current.panX + (e.touches[0].clientX - slideDragStartRef.current.x), y: slideDragStartRef.current.panY + (e.touches[0].clientY - slideDragStartRef.current.y) });
                        }}
                        onTouchEnd={() => setSlideDragging(false)}
                        className={`${isBlindFront ? "lg:col-span-12" : "lg:col-span-7"} relative overflow-hidden bg-slate-950 flex items-center justify-center select-none cursor-grab active:cursor-grabbing min-h-[320px]`}
                      >
                        <div
                          style={{ transform: `translate(${slidePan.x}px, ${slidePan.y}px) scale(${slideZoom})`, transformOrigin: "center center" }}
                          className={`relative inline-block ${slideDragging ? "" : "transition-transform duration-300 ease-out"}`}
                        >
                          <img ref={slideImgRef} src={sl.image} alt="" draggable={false} className="max-h-[75vh] max-w-full object-contain pointer-events-none" />
                          {!isBlindFront && showAllAnns && (sl.annotations || []).map(ann => {
                            const isActive = activeAnnId === ann.id;
                            return (
                              <div
                                key={ann.id}
                                style={{ left: `${ann.x}%`, top: `${ann.y}%`, width: `${ann.w}%`, height: `${ann.h}%` }}
                                className={`absolute border-2 pointer-events-none transition-all ${isActive ? "border-red-500 bg-red-500/15 shadow-[0_0_0_2px_rgba(255,255,255,0.8)]" : "border-rose-400/70"}`}
                              >
                                <span className={`absolute -top-5 left-0 px-1.5 py-0.5 rounded text-[10px] font-extrabold whitespace-nowrap ${isActive ? "bg-red-600 text-white" : "bg-rose-900/80 text-rose-100"}`}>{ann.id}</span>
                              </div>
                            );
                          })}
                        </div>
                        <div className="absolute bottom-3 left-3 px-2.5 py-1 rounded bg-black/60 text-[11px] text-slate-300 pointer-events-none">滚轮缩放 · 按住拖拽平移</div>
                      </div>

                      {/* Right Info & Annotation Controls (or Flip Button in Random Front) */}
                      {!isBlindFront ? (
                        <div className="lg:col-span-5 bg-white text-slate-900 overflow-y-auto p-5 space-y-4 border-l border-slate-800">
                          <div className="border-b pb-3">
                            <span className="px-2 py-0.5 rounded bg-blue-100 text-blue-800 text-[11px] font-bold">{sl.category || "镜检切片"}</span>
                            <h3 className="text-xl font-extrabold text-slate-900 mt-1">{sl.name}</h3>
                          </div>

                          {sl.features && (
                            <div className="p-3.5 rounded-xl bg-blue-50/70 border border-blue-200 space-y-1">
                              <div className="text-xs font-extrabold text-blue-800">🔍 为什么判断是它？（核心镜下特征）</div>
                              <p className="text-xs sm:text-sm text-slate-800 whitespace-pre-line leading-relaxed">{sl.features}</p>
                            </div>
                          )}

                          {sl.confusing && (
                            <div className="p-3.5 rounded-xl bg-rose-50/70 border border-rose-200 space-y-1">
                              <div className="text-xs font-extrabold text-rose-800">⚠️ 易混淆对象与鉴别要点</div>
                              <p className="text-xs sm:text-sm text-slate-800 whitespace-pre-line leading-relaxed">{sl.confusing}</p>

                              <p className="text-xs sm:text-sm text-amber-950 whitespace-pre-line">{sl.tips}</p>
                            </div>

                          {Array.isArray(sl.annotations) && sl.annotations.length > 0 && (

                              <div className="flex items-center justify-between">
                                <span className="text-xs font-extrabold text-slate-800">🎯 特别甄别结构（点击自动居中红框放大）</span>
                                <button onClick={resetView} className="text-[11px] text-blue-700 font-bold">查看全景</button>
                              </div>
                              <div className="flex flex-wrap gap-1.5">
                                {sl.annotations.map(ann => (
                                  <button key={ann.id} onClick={() => focusAnnotation(ann)} className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition ${activeAnnId === ann.id ? "bg-red-600 text-white border-red-600 shadow" : "bg-white text-slate-800 border-slate-300 hover:border-red-400"}`}>
                                    {ann.label}

                              </div>
                              {activeAnn && (

                            </div>

                      ) : (
                        <div className="fixed bottom-16 left-1/2 -translate-x-1/2 z-20">
                          <button onClick={() => setSlideRevealed(true)} className="px-8 py-3.5 rounded-2xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold text-sm sm:text-base shadow-2xl">
                            🔄 翻转查看这是什么（揭晓答案与红框标注）
                          </button>
                        </div>
                      )}
                    </div>

                    <footer className="bg-slate-950 border-t border-slate-800 px-4 py-2.5 flex items-center justify-between text-xs shrink-0">
                      <button disabled={slideIdx === 0} onClick={() => goSlide(slideIdx - 1)} className="px-4 py-1.5 rounded-lg bg-slate-800 disabled:opacity-40 font-bold">← 上一张</button>
                      {slideMode === "random" && (
                        <button onClick={() => {
                          const reshuffled = [...slideQueue].sort(() => Math.random() - 0.5);

                          goSlide(0);
                          showToast("已重新随机打散全部切片！", "info");
                        }} className="px-3 py-1.5 rounded-lg bg-indigo-700 font-bold">🎲 重新洗牌</button>

                    </footer>
                  </div>

              {/* MODAL: SINGLE QUESTION NOTE (MARKDOWN + LATEX + PHOTO PASTE/UPLOAD) */}
              {showNotesModal && session && (() => {

                const curNote = normalizeNote(notesMap[curId]);
                return (
                  <div className="fixed inset-0 z-50 bg-slate-950/65 flex items-center justify-center p-4">
                    <div className="w-full max-w-2xl bg-white text-slate-900 rounded-2xl shadow-2xl p-5 max-h-[88vh] flex flex-col space-y-3">

                            <button onClick={() => setNoteTab("edit")} className={`px-2.5 py-1 rounded font-bold ${noteTab === "edit" ? "bg-blue-700 text-white" : "bg-slate-100"}`}>编辑</button>
                            <button onClick={() => setNoteTab("preview")} className={`px-2.5 py-1 rounded font-bold ${noteTab === "preview" ? "bg-blue-700 text-white" : "bg-slate-100"}`}>渲染预览</button>

                                const items = e.clipboardData?.items;
                                if (!items) return;
                                for (let i = 0; i < items.length; i++) {
                                  if (items[i].type.indexOf("image") !== -1) { e.preventDefault(); handleAttachNoteImage(curId, items[i].getAsFile()); break; }
                                }
                              }}
                              onChange={(e) => updateQuestionNote(curId, { text: e.target.value })}
                              placeholder="支持 Markdown 语法、LaTeX 公式（如 $PaCO_2$、$$\\frac{HCO_3^-}{H_2CO_3}$$），并可直接 Ctrl+V 粘贴截图..."

                    <div className="px-5 pt-3 border-b flex flex-wrap gap-4 text-xs sm:text-sm font-semibold">
                      {[["structure", "1. 学期/学科/章节"], ["import", "2. JSON 批量导入"], ["addQ", "3. 手动录题"], ["browse", `4. 题库管理 (${questions.length})`], ["invites", "5. 🔑 邀请码管理"], ["slides", `6. 🔬 镜检切片 (${slides.length})`]].map(([t, l]) => (
                        <button key={t} onClick={() => setAdminTab(t)} className={`pb-2.5 border-b-2 ${adminTab === t ? "border-blue-600 text-blue-700" : "border-transparent text-slate-500"}`}>{l}</button>

                                    onMouseDown={(e) => { const r = e.currentTarget.getBoundingClientRect(); const x = ((e.clientX - r.left) / r.width) * 100, y = ((e.clientY - r.top) / r.height) * 100; setSlDrawBox({ sx: x, sy: y, cx: x, cy: y }); }}
                                    onMouseMove={(e) => { if (!slDrawBox) return; const r = e.currentTarget.getBoundingClientRect(); setSlDrawBox(d => ({ ...d, cx: Math.min(100, Math.max(0, ((e.clientX - r.left) / r.width) * 100)), cy: Math.min(100, Math.max(0, ((e.clientY - r.top) / r.height) * 100)) })); }}
                                    onMouseUp={() => { if (!slDrawBox) return; const x = Math.round(Math.min(slDrawBox.sx, slDrawBox.cx)), y = Math.round(Math.min(slDrawBox.sy, slDrawBox.cy)), w = Math.round(Math.abs(slDrawBox.cx - slDrawBox.sx)), h = Math.round(Math.abs(slDrawBox.cy - slDrawBox.sy)); if (w >= 3 && h >= 3) setSlTempBox({ x, y, w, h }); setSlDrawBox(null); }}>
                                    <img src={slImg} alt="" draggable={false} className="max-h-64 pointer-events-none" />
                                    {slAnns.map(a => <div key={a.id} style={{ left: `${a.x}%`, top: `${a.y}%`, width: `${a.w}%`, height: `${a.h}%` }} className="absolute border-2 border-red-500 bg-red-500/15 pointer-events-none"><span className="bg-red-600 text-white text-[10px] px-1">{a.id}</span></div>)}
                                    {slTempBox && <div style={{ left: `${slTempBox.x}%`, top: `${slTempBox.y}%`, width: `${slTempBox.w}%`, height: `${slTempBox.h}%` }} className="absolute border-2 border-amber-400 bg-amber-400/20 pointer-events-none" />}
                                  </div>
                                </div>
                                {slTempBox && (
                                  <div className="p-2.5 rounded-lg bg-amber-50 border border-amber-300 flex flex-wrap gap-2 items-center">
                                    <input type="text" value={slAnnLabel} onChange={(e) => setSlAnnLabel(e.target.value)} placeholder="结构名称 (如 c. 核仁)" className="border rounded px-2 py-1 bg-white flex-1" />
                                    <input type="text" value={slAnnDesc} onChange={(e) => setSlAnnDesc(e.target.value)} placeholder="结构特点说明" className="border rounded px-2 py-1 bg-white flex-1" />
                                    <button onClick={() => {
                                      const nextId = String.fromCharCode(99 + slAnns.length); // c, d, e...
                                      setSlAnns(p => [...p, { id: nextId, label: slAnnLabel.trim() || `${nextId}. 关键结构`, desc: slAnnDesc.trim(), ...slTempBox }]);
                                      setSlTempBox(null); setSlAnnLabel(""); setSlAnnDesc("");
                                    }} className="px-3 py-1 rounded bg-red-600 text-white font-bold">+ 确认添加红框</button>
                                  </div>
                                )}
                              </div>
                            )}

                            <textarea rows={2} value={slFeatures} onChange={(e) => setSlFeatures(e.target.value)} placeholder="识别特征：为什么认为是它？" className="w-full border rounded-lg p-2 bg-white" />
                            <textarea rows={2} value={slConfusing} onChange={(e) => setSlConfusing(e.target.value)} placeholder="易混淆对象与鉴别点..." className="w-full border rounded-lg p-2 bg-white" />
                            <input type="text" value={slTips} onChange={(e) => setSlTips(e.target.value)} placeholder="记忆口诀 / 临床意义..." className="w-full border rounded-lg px-3 py-2 bg-white" />
                            <button onClick={() => {
                              if (!slName.trim() || !slImg) { showToast("请填写切片名称并上传/粘贴图片", "error"); return; }
                              setSlides(p => [{ id: `sl_${Date.now()}`, name: slName.trim(), category: slCat.trim() || "切片", image: slImg, features: slFeatures.trim(), confusing: slConfusing.trim(), tips: slTips.trim(), annotations: slAnns }, ...p]);
                              setSlName(""); setSlImg(""); setSlFeatures(""); setSlConfusing(""); setSlTips(""); setSlAnns([]);
                              showToast("切片已添加至本地，记得点上方“发布切片库至全端”", "success");
                            }} className="w-full py-2 rounded-xl bg-blue-700 text-white font-bold">保存该张切片</button>
                          </div>

                          {/* Current Slides List */}
                          <div className="space-y-1.5 max-h-48 overflow-y-auto">
                            {slides.map(sl => (
                              <div key={sl.id} className="p-2 rounded-lg border flex justify-between items-center bg-white">
                                <span className="font-bold">{sl.name} <span className="text-slate-400 font-normal">({sl.category} · {(sl.annotations || []).length}个红框)</span></span>
                                <button onClick={() => setSlides(p => p.filter(x => x.id !== sl.id))} className="text-rose-600 font-bold">删除</button>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {/* MODAL: FSRS MISTAKES */}
              {showMistakeModal && (
                <div className="fixed inset-0 z-50 bg-slate-950/75 flex items-center justify-center p-4">
                  <div className="w-full max-w-3xl bg-white rounded-2xl shadow-2xl p-5 max-h-[88vh] flex flex-col space-y-4">
                    <div className="flex justify-between items-center border-b pb-3"><h3 className="font-bold text-lg">FSRS 错题强化 ({dueMistakes.length} 到期)</h3><button onClick={() => setShowMistakeModal(false)}><Icon name="x" className="w-5 h-5" /></button></div>
                    <div className="overflow-y-auto flex-1 space-y-4">
                      {!dueMistakes[0] ? <div className="text-center py-12 text-slate-500">🎉 今日到期错题已全部复习完毕！</div> : (() => {
                        const mq = dueMistakes[0].question;
                        return (
                          <div className="space-y-4">
                            <div className="text-xs font-bold text-blue-700">{getChapterLabel(mq.chapterId)}</div>
                            <p className="text-sm whitespace-pre-line">{mq.stem}</p>
                            {mistakeRevealed && <div className="p-4 rounded-xl bg-slate-50 border text-xs"><div className="font-bold text-emerald-700">参考答案：{mq.type === "choice" ? mq.answer : mq.type === "blank" ? (mq.blanks || []).join(" / ") : "见解析"}</div><p className="mt-1">{mq.explanation}</p></div>}
                            {!mistakeRevealed ? <button onClick={() => setMistakeRevealed(true)} className="w-full py-2.5 rounded-xl bg-blue-700 text-white font-bold text-sm">显示答案</button> : (
                              <div className="grid grid-cols-4 gap-2">{[[1, "Again", "bg-rose-600"], [2, "Hard", "bg-amber-600"], [3, "Good", "bg-emerald-600"], [4, "Easy", "bg-sky-600"]].map(([g, l, c]) => (
                                <button key={g} onClick={() => { const next = fsrsSchedule(dueMistakes[0].fsrs, g); setMistakes(p => p.map(m => m.id === mq.id ? { ...m, fsrs: next } : m)); markProgDirty(); setMistakeRevealed(false); }} className={`${c} text-white rounded-xl py-2 text-xs font-bold`}>{l} ({formatFsrsInterval(fsrsSchedule(dueMistakes[0].fsrs, g))})</button>
                              ))}</div>
                            )}
                          </div>
                        );
                      })()}
                    </div>
                  </div>
                </div>
              )}

              {/* MODAL: ACCOUNT, INCREMENTAL SYNC & FULL JSON BACKUP */}
              {showAuthModal && (
                <div className="fixed inset-0 z-50 bg-slate-950/70 flex items-center justify-center p-4">
                  <div className="w-full max-w-md bg-white rounded-2xl p-5 space-y-4 text-xs">
                    <div className="flex justify-between font-bold text-base"><span>账号、增量同步与本地保底备份</span><button onClick={() => setShowAuthModal(false)}><Icon name="x" className="w-5 h-5" /></button></div>
                    <div className="p-3 bg-slate-50 rounded-xl border flex justify-between items-center">
                      <span>当前账号: <strong>{currentUser}</strong> {isAdmin && <span className="ml-1 px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold">管理员</span>}</span>
                      <button onClick={async () => { await syncUserProgress("push", true); manualLogoutRef.current = true; setUserToken(""); setRefreshToken(""); setCurrentUser("guest"); setShowAuthModal(false); }} className="text-rose-600 font-bold">保存并退出</button>
                    </div>
                    <div className="flex gap-2">
                      <button disabled={cloudBusy} onClick={() => syncUserProgress("push", false)} className="flex-1 py-2.5 rounded-xl bg-blue-700 text-white font-bold">增量上传进度与笔记</button>
                      <button disabled={cloudBusy} onClick={() => syncUserProgress("pull", false)} className="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white font-bold">增量拉取合并</button>
                    </div>
                    <div className="pt-3 border-t space-y-2">
                      <div className="font-bold text-slate-700">📦 本地全量保底备份（不依赖云端，防意外丢失）：</div>
                      <div className="flex gap-2">
                        <button onClick={exportFullLocalBackup} className="flex-1 py-2 rounded-xl bg-slate-800 text-white font-bold">一键导出备份 (.json)</button>
                        <label className="flex-1 py-2 rounded-xl bg-slate-100 border border-slate-300 text-slate-800 font-bold text-center cursor-pointer">从备份恢复 (.json)<input type="file" accept=".json" className="hidden" onChange={(e) => { importFullLocalBackup(e.target.files?.[0]); e.target.value = ""; }} /></label>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {zoomImage && <div onClick={() => setZoomImage(null)} className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4"><img src={zoomImage} alt="" className="max-w-full max-h-[90vh] rounded-lg" /></div>}
            </>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
